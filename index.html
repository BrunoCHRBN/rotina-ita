/* Substitui os <i data-lucide> pelo SVG do mapa repetindo o merge que o
   createIcons() fazia: os atributos do placeholder são copiados por cima
   dos defaults, a classe é ANEXADA depois de `lucide lucide-<nome>` e um
   placeholder com aria-label não leva aria-hidden. Um call site depende
   disso — o check verde da aba Hoje passa style="color:var(--c-ok)" e a
   classe do nav passava h-[18px] w-[18px].
   A query é só <i>: o <svg> resultado carrega data-lucide, e uma query
   genérica por [data-lucide] re-processaria o próprio substituto a cada
   render, acumulando classe. Ícone fora do mapa não é apagado em silêncio —
   fica como <i> órfão e o nome aparece no console. */
function paint() {
  const faltando = [];
  document.querySelectorAll('i[data-lucide]').forEach(el => {
    const nome = el.getAttribute('data-lucide');
    const html = ICONES[nome];
    if (!html) { faltando.push(nome); return; }
    const tpl = document.createElement('template');
    tpl.innerHTML = html;
    const svg = tpl.content.firstElementChild;
    if (!svg) { faltando.push(nome); return; }
    [...el.attributes].forEach(a => {
      if (a.name === 'data-lucide') return;
      if (a.name === 'class') {
        svg.setAttribute('class', svg.getAttribute('class') + ' ' + a.value);
      } else {
        svg.setAttribute(a.name, a.value);
      }
    });
    if (el.hasAttribute('aria-label') || el.hasAttribute('aria-labelledby')) {
      svg.removeAttribute('aria-hidden');
    }
    el.replaceWith(svg);
  });
  if (faltando.length) console.warn('Ícone ausente do mapa ICONES:', faltando.join(', '));
}


function renderNav() {
  const items = [
    { id: 'hoje',      label: 'Hoje',      icon: 'calendar-check' },
    { id: 'semana',    label: 'Semana',    icon: 'calendar-days' },
    { id: 'conteudos', label: 'Conteúdos', icon: 'book-open' },
    { id: 'progresso', label: 'Progresso', icon: 'chart-column' },
    { id: 'ajustes',   label: 'Ajustes',   icon: 'settings' },
  ];
  $('#nav').innerHTML = items.map(it => `
    <button type="button" class="nav-btn" data-act="tab" data-tab="${it.id}"
      ${UI.tab === it.id ? 'aria-current="page"' : ''}>
      <i data-lucide="${it.icon}" class="h-[18px] w-[18px]"></i>
      <span>${it.label}</span>
    </button>`).join('');
}

function renderHeaderChip() {
  /* O "cabeçalho corrente" de um jornal: o estado da semana correndo à
     direita do título, em tinta baixa. Era uma pílula com fundo e borda. */
  const acts = currentWeekActivities();
  const done = acts.filter(a => a.done).length;
  $('#hdr-chip').innerHTML =
    `<span class="ink3">semana</span> <span class="num ink">${fmtMinutes(weekMinutes())}</span> <span class="ink3">de ${fmtMinutes(goalMinutes())}</span>${
      acts.length ? `<span class="hidden ink3 sm:inline">, ${done} de ${acts.length} concluídas</span>` : ''}`;
}

/* ---------------------------------------------------------------------------
   FOCO ATRAVÉS DO RENDER
   ---------------------------------------------------------------------------
   `render()` reescreve #nav e #view com innerHTML. Todo elemento focado deixa de
   existir, e o foco do navegador cai para `body` — sem erro, sem aviso, e a tela
   fica idêntica. A consequência é de teclado: o próximo Tab recomeça do TOPO do
   documento. Medido antes desta correção: mudando o status do 1º de 56 tópicos,
   `document.activeElement` virava `body` e o Tab ia para o botão do #nav.

   A identidade do elemento é reconstruída por tag + TODOS os data-*, porque é o
   que o render preserva: `set-status` tem data-id (o tópico), `set-prio` e
   `toggle-subject` têm data-subject, `prog-period` tem data-period, e `set-goal`
   e `set-avail` são únicos pelo próprio data-act. Comparar por posição não serve
   (a lista muda de tamanho); comparar por texto não serve (o rótulo muda). */
function chaveDeFoco(el) {
  if (!el || !el.dataset) return null;
  const partes = Object.keys(el.dataset).sort().map(k => `${k}=${el.dataset[k]}`);
  return `${el.tagName.toLowerCase()}|${partes.join('&')}`;
}

function capturarFoco() {
  const el = document.activeElement;
  if (!el || el === document.body || !el.dataset) return null;
  const chave = chaveDeFoco(el);
  if (!chave) return null;
  /* seleção de texto: sem ela o cursor volta para o início do campo e digitar
     continua no lugar errado. `selectionStart` é null em input[type=number]. */
  const sel = typeof el.selectionStart === 'number'
    ? { ini: el.selectionStart, fim: el.selectionEnd } : null;
  return { chave, sel };
}

function restaurarFoco(snap) {
  if (!snap) return;
  const alvo = Array.from(document.querySelectorAll('[data-act]'))
    .find(el => chaveDeFoco(el) === snap.chave);
  /* o controle pode ter sumido no novo render (ex.: "Carregar mais" quando não
     há mais nada a carregar). Nesse caso não há o que restaurar. */
  if (!alvo) return;
  alvo.focus();
  if (snap.sel && typeof alvo.setSelectionRange === 'function') {
    try { alvo.setSelectionRange(snap.sel.ini, snap.sel.fim); } catch (err) { /* type=number recusa */ }
  }
}

function render() {
  const foco = capturarFoco();
  renderNav();
  renderHeaderChip();
  const map = { hoje: viewHoje, semana: viewSemana, conteudos: viewConteudos, progresso: viewProgresso, ajustes: viewAjustes };
  $('#view').innerHTML = (map[UI.tab] || viewHoje)();
  paint();
  restaurarFoco(foco);
}

/* ---------------------------------------------------------------------------
   8. COMPONENTES
   ---------------------------------------------------------------------------
   Três trocas de fundo, todas tiradas da mesma tese (a cor pertence à matéria;
   a régua carrega a estrutura):

   1. a matéria deixa de ser uma PÍLULA com fundo tingido e vira um PONTO de
      7px + o nome em tinta. O ponto basta: tingir o fundo para dizer "Física"
      gasta a cor da matéria em decoração.
   2. estado e prioridade deixam de ser pílulas e viram PALAVRAS em itálico —
      é o que se escreve num caderno. O texto carrega o sentido; a cor reforça.
   3. a cifra deixa de ser um "stat card" e vira uma coluna de ledger: rótulo
      em cima, número embaixo, sem caixa nenhuma.
   -------------------------------------------------------------------------- */
function subjectDot(s, size = 7) {
  return `<span class="inline-block shrink-0 rounded-full" style="width:${size}px;height:${size}px;background:${subjFill(s)}"></span>`;
}
function subjectName(subjectId) {
  const s = subjectOf(subjectId);
  return `<span class="inline-flex items-baseline gap-2">${subjectDot(s)}<span class="ink2">${esc(s.name)}</span></span>`;
}
/* prioridade é uma ORDEM, não um estado — e ordem, num índice impresso, se diz
   por peso de tinta, não por cor. Isso também devolve a cor da linha inteira à
   matéria: a bolinha era o único colorido que sobrava. */
function priorityWord(p) {
  const pr = PRIORITY[p] || PRIORITY.media;
  const estilo = p === 'alta' ? 'color:var(--c-ink);font-weight:600'
    : p === 'baixa' ? 'color:var(--c-ink3)'
    : 'color:var(--c-ink2)';
  return `<span class="italic" style="${estilo}">${pr.label}</span>`;
}
function statusWord(st) {
  const s = STATUS[st] || STATUS.nao_iniciado;
  const cor = st === 'concluido' ? 'var(--c-ok)' : st === 'em_estudo' ? 'var(--c-ink)' : 'var(--c-ink3)';
  return `<span class="italic" style="color:${cor}">${s.label}</span>`;
}

/* barra de progresso. `pace` desenha a régua de ritmo (onde você deveria estar).
   Ponta reta, não pílula: é uma régua, não um medidor de app. */
function progressBar(value, max, color = 'var(--c-ink)', height = 6, pace = null) {
  const p = pct(value, max);
  const h = typeof height === 'number' ? `${height}px` : height;
  return `<div class="relative w-full">
    <div class="track w-full" style="height:${h}">
      <div class="fill" style="width:${p}%;background:${color}"></div>
    </div>
    ${pace !== null ? `<span class="pace" style="left:${clamp(pace, 0, 100)}%" title="Ritmo esperado até hoje: ${Math.round(pace)}%"></span>` : ''}
  </div>`;
}

/* vazio: a ÚNICA superfície que este desenho permite fora do que flutua (modal,
   aviso). Sem ela o estado vazio era uma frase solta no meio da página, sem
   forma e sem pista do que fazer. Fio de 1px, canto reto, ícone simbólico —
   papel pautado, não card. */
function emptyState(icon, title, text, actionHtml = '', size = 'md') {
  const pad = size === 'sm' ? 'px-6 py-7' : 'px-6 py-11';
  return `<div class="leaf ${pad} text-center">
    <div class="mb-2.5 flex justify-center"><i data-lucide="${icon}" class="h-5 w-5 ink3"></i></div>
    <p class="t-body ink2">${esc(title)}</p>
    <p class="measure mx-auto mt-1.5 t-hint italic">${esc(text)}</p>
    ${actionHtml ? `<div class="mt-4">${actionHtml}</div>` : ''}
  </div>`;
}

/* cabeçalho de seção: título + fio que corre até a margem.
   Substitui o rótulo-sobrancelha em caixa alta — o fio já diz "seção nova". */
function sectionTitle(text, right = '') {
  return `<div class="sec-head mb-2.5">
    <h2 class="t-h2 ink">${esc(text)}</h2>
    ${right}
  </div>`;
}

/* cifra de ledger — rótulo, número, nota. Sem caixa, sem fundo, sem sombra. */
function figure(label, value, hint = '', extra = '') {
  return `<div class="${extra}">
    <p class="t-field">${esc(label)}</p>
    <p class="t-num mt-1 ink">${esc(value)}</p>
    ${hint ? `<p class="mt-1 t-hint">${esc(hint)}</p>` : ''}
  </div>`;
}

/* linha de atividade (usada em Hoje e Semana).
   Era um card com fundo e sombra; agora é uma linha de caderno: fio de 2px da
   matéria à esquerda, o tópico em tinta, as cifras alinhadas à direita.
   Tirei o line-through: sobre serifada ele corta as descendentes e suja a
   linha. Quem diz "concluída" é a palavra em itálico + a tinta mais baixa. */
function activityRow(a, opts = {}) {
  const t = topicById(a.topicId);
  const s = subjectOf(a.subjectId);
  const nome = esc(t ? t.name : 'Tópico removido');

  /* Planejado e realizado são coisas diferentes desde que plannedMinutes existe.
     O número principal da linha é o PLANO; quando a atividade já foi concluída e o
     tempo real difere, o real aparece ao lado, discreto — é a comparação que dá
     sentido ao registro, e é o que o rótulo "Planejado" promete. */
  const realMin = a.done
    ? S.sessions.filter(x => x.activityId === a.id).reduce((sum, x) => sum + x.minutes, 0)
    : 0;
  const sufixoReal = (a.done && realMin > 0 && realMin !== a.plannedMinutes)
    ? ` <span class="ink3">· ${fmtMinutes(realMin)}</span>` : '';

  const botaoConcluir = `<button type="button" data-act="complete" data-id="${a.id}"
      title="${a.done ? 'Reabrir atividade' : 'Concluir e registrar sessão'}"
      aria-label="${a.done ? 'Reabrir' : 'Concluir'} ${nome}"
      class="grid ${opts.compact ? 'h-4 w-4' : 'mt-1 h-[18px] w-[18px]'} shrink-0 place-items-center rounded-[3px] border transition-colors"
      style="border-color:${a.done ? 'var(--c-ok)' : 'var(--c-ink3)'}">
      ${a.done ? `<i data-lucide="check" class="h-2.5 w-2.5" style="color:var(--c-ok)"></i>` : ''}
    </button>`;

  const acoes = `<span class="flex items-center gap-0.5 transition-opacity duration-150 md:opacity-0 md:group-hover:opacity-100 md:group-focus-within:opacity-100">
      <button type="button" data-act="edit-activity" data-id="${a.id}" class="${BTN_ICON} is-sm" title="Editar tópico, duração, prioridade e dia" aria-label="Editar atividade"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
      <button type="button" data-act="del-activity" data-id="${a.id}" class="${BTN_ICON} is-sm is-danger" title="Remover" aria-label="Remover"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
    </span>`;

  /* modo compacto: uma linha só, para o ledger da semana.
     Aqui o tópico já está dentro do dia, então não repete matéria nem dia.
     flex-wrap: quando a coluna do dia fica estreita (janelas pequenas, ou fonte
     ampliada a 200%), o tempo e os botões descem para a segunda linha em vez de
     empurrar a página para o lado. Em telas largas nada muda — só envolve se
     precisar. */
  if (opts.compact) {
    return `<div class="group flex flex-wrap items-center gap-x-3 gap-y-0.5 py-1">
      ${botaoConcluir}
      ${subjectDot(s, 6)}
      <span class="min-w-0 flex-1 truncate t-meta ${a.done ? 'ink3' : 'ink'}">${nome}</span>
      <span class="shrink-0 t-hint num">${fmtMinutes(a.plannedMinutes)}${sufixoReal}</span>
      ${acoes}
    </div>`;
  }

  const meta = [
    subjectName(a.subjectId),
    priorityWord(a.priority),
    opts.showDay ? (a.day === null ? 'sem dia fixo' : DAYS[a.day]) : '',
    a.done ? `<span style="color:var(--c-ok)">concluída</span>` : '',
  ].filter(Boolean).join('');

  return `<div class="row rail group flex items-start gap-3.5 py-3 pl-4" style="--rail:${subjFill(s)}">
    ${botaoConcluir}
    <div class="min-w-0 flex-1">
      <p class="t-body ${a.done ? 'ink3' : 'ink'}">${nome}</p>
      <p class="mt-0.5 flex flex-wrap items-baseline gap-x-3 gap-y-0.5 t-hint">${meta}</p>
    </div>
    <div class="flex shrink-0 items-center gap-2">
      <span class="t-meta ink num">${fmtMinutes(a.plannedMinutes)}${sufixoReal}</span>
      ${acoes}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   9. ABA 1 — HOJE
   ------------------------------------------------------------------------- */
function onboardingCard() {
  /* A única numeração legítima desta interface: isto É uma sequência — três
     passos, nesta ordem. Onde não há ordem, não entra número. */
  const passos = [
    { n: '1', t: 'Escolha seus tópicos', d: 'O banco já vem com o conteúdo do ITA. Marque o status conforme avança.', tab: 'conteudos', cta: 'Abrir Conteúdos' },
    { n: '2', t: 'Planeje a semana', d: 'Crie atividades com duração, prioridade e dia. Ou deixe sem dia fixo e encaixe quando quiser.', tab: 'semana', cta: 'Abrir Semana' },
    { n: '3', t: 'Registre o que estudou', d: 'Ao concluir, informe a duração real. Nada rola sozinho: o controle é seu.', tab: 'progresso', cta: 'Ver Progresso' },
  ];
  return `<section class="sec-top">
    ${sectionTitle('Comece por aqui', `<span class="t-hint">leva dois minutos</span>`)}
    <div class="mt-1">
      ${passos.map(p => `
        <div class="row rail flex items-start gap-4 py-3 pl-4" style="--rail:var(--c-rule)">
          <span class="t-num shrink-0 ink3 num">${p.n}</span>
          <div class="min-w-0 flex-1">
            <p class="t-body ink">${esc(p.t)}</p>
            <p class="measure mt-0.5 t-hint">${esc(p.d)}</p>
          </div>
          <button type="button" class="word shrink-0" data-act="tab" data-tab="${p.tab}">${esc(p.cta)}</button>
        </div>`).join('')}
    </div>
  </section>`;
}

function viewHoje() {
  const idx = todayIndex();
  const acts = currentWeekActivities();
  const todayOpen = acts.filter(a => a.day === idx && !a.done);
  const todayDone = acts.filter(a => a.day === idx && a.done);
  const noDay = acts.filter(a => a.day === null && !a.done);
  const past = pastOpenActivities();

  /* O REAL das atividades concluídas hoje vem das SESSÕES, não da atividade: a
     atividade guarda o plano. É a única forma de o par "planejado · estudados"
     significar duas coisas distintas. */
  const idsHoje = new Set(todayDone.map(a => a.id));
  const realHoje = S.sessions
    .filter(s => s.activityId && idsHoje.has(s.activityId))
    .reduce((sum, s) => sum + s.minutes, 0);

  const wm = weekMinutes(), gm = goalMinutes();
  const p = pct(wm, gm);
  const pace = pacePct();
  const bateu = p >= 100;
  const primeiraVez = S.activities.length === 0 && S.sessions.length === 0;
  const porPrioridade = (a, b) =>
    (PRIORITY[b.priority].weight - PRIORITY[a.priority].weight) || (b.plannedMinutes - a.plannedMinutes);

  /* aviso: faixa pautada, sem caixa colorida. O fio diz o tom; o texto explica
     e a ação fica ao lado. Nada foi bloqueado — a frase diz isso. */
  const carry = past.length ? `
    <div class="rail mb-7 flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-3 pl-4"
         style="--rail:var(--c-warn)">
      <div class="min-w-0">
        <p class="t-body" style="color:var(--c-warn)">${past.length} ${past.length === 1 ? 'atividade ficou' : 'atividades ficaram'} em semanas anteriores</p>
        <p class="measure mt-0.5 t-hint">Nada rolou automaticamente. Traga para esta semana como “sem dia fixo” ou deixe onde está.</p>
      </div>
      <button type="button" class="${BTN_GHOST} btn-sm shrink-0" data-act="carry-all">Trazer para esta semana</button>
    </div>` : '';

  return `
    ${carry}
    ${primeiraVez ? onboardingCard() : ''}

    <section>
      <div class="flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2">
        <div class="min-w-0">
          <h1 class="t-h1 ink">${esc(longDate())}</h1>
          <p class="mt-1 t-meta">${DAYS[idx]}${
            todayOpen.length
              ? `, ${todayOpen.length} ${todayOpen.length === 1 ? 'atividade planejada' : 'atividades planejadas'}`
              : ', nada planejado'}</p>
        </div>
        <button type="button" class="${BTN_PRI}" data-act="unplanned">
          <i data-lucide="plus" class="h-3.5 w-3.5"></i>Registrar estudo não planejado
        </button>
      </div>
    </section>

    <!-- O ÚNICO momento alto da página: a cifra da semana em 40px.
         Tudo em volta fica em tinta baixa para que ela seja o que se vê. -->
    <section class="sec">
      ${sectionTitle('A semana', `<span class="t-hint">${shortDate(weekRange().start)} a ${shortDate(weekRange().end)}</span>`)}
      <div class="flex flex-wrap items-end justify-between gap-x-8 gap-y-2 pt-2">
        <p class="t-display ink num">${fmtMinutes(wm)} <span class="t-h1 ink3">de ${fmtMinutes(gm)}</span></p>
        <p class="t-num num" style="color:${bateu ? 'var(--c-ok)' : 'var(--c-ink2)'}">${Math.round(p)}%</p>
      </div>
      <div class="mt-4">${progressBar(wm, gm, bateu ? 'var(--c-ok)' : 'var(--c-ink)', 6, pace)}</div>
      <div class="mt-2.5 flex flex-wrap justify-between gap-x-6 gap-y-1 t-hint">
        <span>${Math.round(pace)}% da semana já passou</span>
        ${acts.length ? `<span>${todayDone.length + acts.filter(a => a.done && a.day !== idx).length} de ${acts.length} atividades concluídas</span>` : ''}
      </div>
    </section>

    <section class="sec">
      ${sectionTitle('Pendências de hoje', todayOpen.length ? `<span class="t-hint">${fmtMinutes(todayOpen.reduce((s, a) => s + a.plannedMinutes, 0))} estimados</span>` : '')}
      <div class="mt-1">
        ${todayOpen.length
          ? todayOpen.sort(porPrioridade).map(a => activityRow(a)).join('')
          : emptyState('sun', 'Nada planejado para hoje', 'Adiante um tópico sem dia fixo ou registre um estudo avulso.', '', 'sm')}
      </div>
    </section>

    ${noDay.length ? `
    <section class="sec">
      ${sectionTitle('Sem dia fixo nesta semana', `<span class="t-hint">você escolhe quando encaixar</span>`)}
      <div class="mt-1">${noDay.sort(porPrioridade).map(a => activityRow(a)).join('')}</div>
    </section>` : ''}

    ${todayDone.length ? `
    <section class="sec">
      ${sectionTitle('Concluídas hoje', `<span class="t-hint">${fmtMinutes(todayDone.reduce((s, a) => s + a.plannedMinutes, 0))} planejados${realHoje ? ` · ${fmtMinutes(realHoje)} estudados` : ''}</span>`)}
      <div class="mt-1">${todayDone.map(a => activityRow(a)).join('')}</div>
    </section>` : ''}

    <section class="sec">
      ${sectionTitle('Sessões registradas hoje')}
      ${todaySessionsList()}
    </section>`;
}

function todaySessionsList() {
  const list = S.sessions.filter(s => s.date === todayIso());
  if (!list.length) return emptyState('history', 'Nenhuma sessão registrada hoje', 'Ao concluir uma atividade ou registrar um estudo avulso, ele aparece aqui.', '', 'sm');
  return `<div class="mt-1">
    ${list.map(s => {
      const sub = subjectOf(s.subjectId);
      const t = s.topicId ? topicById(s.topicId) : null;
      const linha = [TYPES[s.type] || 'Teoria', s.notes].filter(Boolean);
      return `<div class="row rail group flex items-baseline gap-3.5 py-3 pl-4" style="--rail:${subjFill(sub)}">
        <div class="min-w-0 flex-1">
          <p class="t-body ink">${esc(t ? t.name : 'Estudo avulso')}</p>
          <p class="mt-0.5 t-hint">${subjectDot(sub)} <span class="ml-2">${esc(sub.name)}</span>${
            linha.length ? `<span class="ml-3 italic">${esc(linha.join(' — '))}</span>` : ''}</p>
        </div>
        <span class="shrink-0 t-meta ink num">${fmtMinutes(s.minutes)}</span>
        <!-- A sessão que você acabou de registrar tem de ser corrigível AQUI. Antes
             esta lista era só leitura e a mesma sessão só era editável na tabela do
             Progresso — para consertar um número digitado errado havia que trocar de
             aba. Os dois botões são os mesmos daquela tabela. -->
        <span class="flex shrink-0 items-center gap-0.5 self-center transition-opacity duration-150 md:opacity-0 md:group-hover:opacity-100 md:group-focus-within:opacity-100">
          <button type="button" data-act="edit-session" data-id="${s.id}" class="${BTN_ICON} is-sm" title="Editar" aria-label="Editar sessão"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
          <button type="button" data-act="del-session" data-id="${s.id}" class="${BTN_ICON} is-sm is-danger" title="Excluir" aria-label="Excluir sessão"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
        </span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ---------------------------------------------------------------------------
   10. ABA 2 — SEMANA
   ------------------------------------------------------------------------- */
function viewSemana() {
  const acts = currentWeekActivities();
  const planned = acts.reduce((s, a) => s + a.plannedMinutes, 0);
  const avail = availabilityMinutes();
  const overload = avail > 0 && planned > avail;
  const bySubject = plannedMinutesBySubject();
  const suggested = suggestedMinutesBySubject();
  const maxDist = Math.max(1, ...SUBJECTS.map(s => Math.max(bySubject[s.id], suggested[s.id])));

  /* aviso de sobrecarga: faixa pautada. O fio diz o tom; a frase explica que
     nada foi bloqueado — o produto não pune, então o aviso não pode gritar. */
  const overloadBox = overload ? `
    <div class="rail sec-top flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-3 pl-4"
         style="--rail:var(--c-warn)">
      <div class="min-w-0">
        <p class="t-body" style="color:var(--c-warn)">${fmtMinutes(planned)} planejados para ${fmtMinutes(avail)} disponíveis</p>
        <p class="measure mt-0.5 t-hint">Você passou ${fmtMinutes(planned - avail)} da sua disponibilidade. Nada foi bloqueado: revise prioridades, encurte durações ou mova itens para “sem dia fixo”.</p>
      </div>
    </div>` : '';

  const semDia = acts.filter(a => a.day === null);

  return `
    ${overloadBox}

    <section>
      ${sectionTitle('Meta e planejamento', `<button type="button" class="${BTN_GHOST} btn-sm" data-act="new-activity"><i data-lucide="plus" class="h-3.5 w-3.5"></i>Nova atividade</button>`)}
      <div class="flex flex-wrap items-start justify-between gap-x-8 gap-y-4 pt-2">
        <label class="block">
          <span class="mb-1.5 block t-field">Meta de horas da semana</span>
          <input type="number" min="0" max="168" step="0.5" value="${S.settings.weeklyGoalHours}"
                 data-act="set-goal" class="${INP} w-28" aria-label="Meta de horas da semana" />
        </label>
        <div class="text-right">
          <p class="mb-1.5 t-field">Planejado nesta semana</p>
          <p class="t-body ink num">${fmtMinutes(planned)}</p>
        </div>
      </div>
      <div class="mt-4">${progressBar(planned, Math.max(avail, planned), overload ? 'var(--c-warn)' : 'var(--c-ink)', 6)}</div>
      <p class="mt-2.5 t-hint">${acts.length} ${acts.length === 1 ? 'atividade' : 'atividades'}, ${acts.filter(a => a.done).length} concluída${acts.filter(a => a.done).length === 1 ? '' : 's'}. Disponibilidade configurada nos Ajustes: ${fmtMinutes(avail)}.</p>
    </section>

    <section class="sec">
      ${sectionTitle('Distribuição por matéria', `<span class="t-hint">planejado e sugerido pela prioridade</span>`)}
      <div class="mt-1">
        <!-- O cabeçalho NÃO quebrava linha. O filho flex-1, sem min-width:0, tem largura
             mínima igual ao próprio texto ("Distribuição" = 247px a 200% de texto), e a
             linha, sem flex-wrap, empurrava a PÁGINA 135px em 768-903px a 200% de texto —
             e o rótulo "Sugerido" saía inteiro para fora da tela, deixando a 2ª linha de
             valores sem coluna. As linhas de dados já quebravam (têm flex-wrap); só o
             cabeçalho não. Com flex-wrap ele quebra igual, e a 100% nada muda (medido em
             768, 900, 1080 e 1440: segue numa linha só). Não aparece no zoom real: 200% de
             zoom numa janela de 768px equivale a 384px de viewport, abaixo do ponto md,
             onde o cabeçalho está oculto — é o mesmo caso do texto ampliado sem zoom. -->
        <div class="hidden flex-wrap items-baseline gap-4 py-1.5 md:flex">
          <span class="w-36 shrink-0 t-col">Matéria</span>
          <span class="flex-1 t-col">Distribuição</span>
          <span class="w-16 shrink-0 text-right t-col">Planejado</span>
          <span class="w-24 shrink-0 text-right t-col">Sugerido</span>
        </div>
        ${SUBJECTS.filter(s => isActiveSubject(s.id) || bySubject[s.id] > 0).map(s => {
          const plannedM = bySubject[s.id] || 0, suggM = suggested[s.id] || 0;
          const inativa = !isActiveSubject(s.id);
          return `<div class="row flex flex-wrap items-center gap-4 py-2.5">
            <span class="flex w-36 shrink-0 items-baseline gap-2">
              ${subjectDot(s, 6)}
              <span class="truncate t-body ${inativa ? 'ink3' : 'ink2'}">${esc(s.name)}</span>
            </span>
            <span class="min-w-0 flex-1">${progressBar(plannedM, maxDist, subjFill(s), 5)}</span>
            <span class="w-16 shrink-0 text-right t-meta ink num">${fmtMinutes(plannedM)}</span>
            <span class="hidden w-24 shrink-0 text-right t-hint md:block">${suggM ? fmtMinutes(suggM) : '—'}</span>
          </div>`;
        }).join('')}
      </div>
      <div class="mt-3 flex flex-wrap items-baseline justify-between gap-x-6 gap-y-3">
        <p class="measure t-hint">A coluna sugerido vem da prioridade definida nos Ajustes, distribuindo a meta de ${fmtMinutes(goalMinutes())} entre as matérias ativas.</p>
        <button type="button" class="${BTN_GHOST} btn-sm shrink-0" data-act="apply-suggestion"><i data-lucide="list-plus" class="h-3.5 w-3.5"></i>Criar atividades da sugestão</button>
      </div>
    </section>

    <!-- O formulário "Nova atividade" que ficava AQUI saiu. Ele obrigava a rolar para
         baixo para ver a semana e para cima para adicionar, e o dia escolhido no select
         não tinha relação com a linha que você estava olhando. Agora a criação mora onde
         a decisão acontece: um "+" em cada linha de dia, outro em "Sem dia fixo", e um
         botão no cabeçalho de "Meta e planejamento" para descoberta. -->

    <!-- A semana como ela é: sete linhas de um caderno, não sete cards iguais.
         O dia de hoje não ganha etiqueta — ganha a tinta cheia e a palavra. -->
    <section class="sec">
      ${sectionTitle('Segunda a domingo', `<span class="t-hint">${fmtMinutes(planned)} na semana</span>`)}
      <div class="mt-1">
        ${DAYS.map((d, i) => {
          const items = acts.filter(a => a.day === i).sort((a, b) => PRIORITY[b.priority].weight - PRIORITY[a.priority].weight);
          const total = items.reduce((s, a) => s + a.plannedMinutes, 0);
          const isToday = i === todayIndex();
          return `<div class="row rail flex flex-wrap items-start gap-4 py-3 pl-4" style="--rail:${isToday ? 'var(--c-ink)' : 'var(--c-rule)'}">
            <span class="w-24 shrink-0 t-body ${isToday ? 'ink' : 'ink2'}">${d}${isToday ? `<span class="ml-2 italic t-hint">hoje</span>` : ''}</span>
            <!-- min-w em px, NÃO em rem: esta coluna é o "miolo" pautado do dia, e o
                 miolo tem partes FIXAS (botão de concluir, ponto, tempo e os dois
                 botões de ação). A 80px de mínimo o dia cabia com a coluna espremida
                 a 88px e as partes fixas — 212px — transbordavam para fora da tela
                 (medido: 40px em 320px). Em rem o mínimo incha junto com a fonte: a
                 200% ele virava 480px e, numa janela de 320px, a própria coluna
                 transbordava (232px, contra 167px antes). Em px o mínimo não incha;
                 quem cede é a linha de baixo (ver flex-wrap em activityRow). -->
            <div class="min-w-[250px] flex-1">
              ${items.length
                ? items.map(a => activityRow(a, { compact: true })).join('')
                : `<p class="t-hint italic">Sem atividades</p>`}
            </div>
            <span class="flex shrink-0 items-center gap-1.5">
              <span class="t-meta num ${items.length ? 'ink' : 'ink3'}">${items.length ? fmtMinutes(total) : '—'}</span>
              <button type="button" data-act="new-activity" data-day="${i}" class="${BTN_ICON} is-sm"
                title="Adicionar atividade em ${d}" aria-label="Adicionar atividade em ${d}"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button>
            </span>
          </div>`;
        }).join('')}
      </div>
    </section>

    <section class="sec">
      ${sectionTitle('Sem dia fixo', `<span class="flex shrink-0 items-center gap-3">${
        semDia.length ? `<span class="t-hint">${semDia.length} ${semDia.length === 1 ? 'atividade' : 'atividades'}</span>` : ''
      }<button type="button" data-act="new-activity" data-day="" class="${BTN_ICON} is-sm" title="Adicionar sem dia fixo" aria-label="Adicionar atividade sem dia fixo"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button></span>`)}
      <div class="mt-1">
        ${semDia.length
          ? semDia.map(a => activityRow(a)).join('')
          : emptyState('calendar-x', 'Nenhuma atividade sem dia', 'Crie uma atividade deixando o dia em branco para montar um banco flexível.', '', 'sm')}
      </div>
    </section>`;
}

/* ---------------------------------------------------------------------------
   11. ABA 3 — CONTEÚDOS
   ------------------------------------------------------------------------- */
function viewConteudos() {
  /* Era uma grade de 6 cards idênticos, com a lista de tópicos espremida em
     meia largura. Agora é um ÍNDICE: uma seção por matéria, largura inteira,
     e o fio que fecha o cabeçalho de cada matéria é a própria barra de
     progresso dela — o fio deixa de ser enfeite e passa a medir. */
  return `
    <p class="measure t-meta">Marque o status conforme avança. Arquivar esconde da lista ativa sem apagar o histórico.</p>

    ${SUBJECTS.map(s => {
      const all = S.topics.filter(t => t.subjectId === s.id);
      const active = all.filter(t => !t.archived);
      const archived = all.filter(t => t.archived);
      const done = active.filter(t => t.status === 'concluido').length;
      const inactive = !isActiveSubject(s.id);
      const p = pct(done, Math.max(1, active.length));

      return `<section class="sec">
        <div class="flex items-center gap-3.5">
          <h2 class="flex shrink-0 items-center gap-2.5 t-h2 ${inactive ? 'ink3' : 'ink'}">
            ${subjectDot(s, 9)}<span>${esc(s.name)}</span>
          </h2>
          ${inactive ? `<span class="shrink-0 t-hint italic">inativa</span>` : ''}
          <span class="hidden min-w-0 flex-1 sm:block" aria-hidden="true">
            <span class="block w-full" style="height:2px;background:var(--c-rule)">
              <span class="block" style="height:2px;width:${p}%;background:${subjFill(s)}"></span>
            </span>
          </span>
          <span class="shrink-0 t-meta ink2 num" aria-label="${done} de ${active.length} tópicos concluídos">
            <span aria-hidden="true">${done}<span class="ink3">/${active.length}</span></span>
          </span>
        </div>

        <div class="mt-1">
          ${active.length
            ? active.map(t => topicRow(t)).join('')
            : `<p class="py-4 t-hint italic">Nenhum tópico ativo nesta matéria.</p>`}
        </div>

        <form data-act="add-topic" data-subject="${s.id}" class="mt-3 flex gap-2">
          <input name="name" required maxlength="80" placeholder="Novo tópico de ${esc(s.name)}"
                 aria-label="Novo tópico de ${esc(s.name)}"
                 class="inp flex-1" ${inactive ? 'disabled' : ''} />
          <button type="submit" class="${BTN_GHOST} shrink-0 px-3" ${inactive ? 'disabled' : ''} title="Adicionar" aria-label="Adicionar tópico"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button>
        </form>

        ${archived.length ? `
        <button type="button" data-act="toggle-archived" data-subject="${s.id}"
          class="word mt-3 inline-flex items-center gap-1.5">
          <i data-lucide="${UI.showArchived[s.id] ? 'chevron-down' : 'chevron-right'}" class="h-3 w-3"></i>
          ${UI.showArchived[s.id] ? 'Ocultar' : 'Mostrar'} ${archived.length} arquivado${archived.length === 1 ? '' : 's'}
        </button>
        <div class="mt-1">${UI.showArchived[s.id] ? archived.map(t => topicRow(t, true)).join('') : ''}</div>` : ''}
      </section>`;
    }).join('')}`;
}

/* linha de tópico: o status é um VALOR, então se lê como texto em itálico, não
   como um select emoldurado. A cor diz o estado; o itálico diz que é editável. */
function topicRow(t, archived = false) {
  const st = t.status;
  const cor = st === 'concluido' ? 'var(--c-ok)' : st === 'em_estudo' ? 'var(--c-ink)' : 'var(--c-ink3)';
  return `<div class="row group flex min-w-0 flex-wrap items-center gap-3 py-2">
    <span class="min-w-0 flex-1 truncate t-body ${archived ? 'ink3' : 'ink2'}">${esc(t.name)}</span>
    <select data-act="set-status" data-id="${t.id}" aria-label="Status de ${esc(t.name)}"
      class="inp-quiet shrink-0" style="color:${cor}">
      ${Object.keys(STATUS).map(k => `<option value="${k}" ${st === k ? 'selected' : ''}>${STATUS[k].label}</option>`).join('')}
    </select>
    <div class="flex shrink-0 items-center gap-0.5 transition-opacity duration-150 md:opacity-0 md:group-hover:opacity-100 md:group-focus-within:opacity-100">
      <button type="button" data-act="edit-topic" data-id="${t.id}" class="${BTN_ICON} is-sm" title="Editar nome" aria-label="Editar nome"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
      <button type="button" data-act="archive-topic" data-id="${t.id}" class="${BTN_ICON} is-sm" title="${archived ? 'Restaurar' : 'Arquivar'}" aria-label="${archived ? 'Restaurar' : 'Arquivar'}">
        <i data-lucide="${archived ? 'rotate-ccw' : 'archive'}" class="h-3.5 w-3.5"></i>
      </button>
      <button type="button" data-act="del-topic" data-id="${t.id}" class="${BTN_ICON} is-sm is-danger" title="Excluir" aria-label="Excluir"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
    </div>
  </div>`;
}

/* ---------------------------------------------------------------------------
   12. ABA 4 — PROGRESSO
   ------------------------------------------------------------------------- */
function viewProgresso() {
  const wSessions = weekSessions();
  const wm = weekMinutes(), gm = goalMinutes();
  const p = pct(wm, gm);
  const pace = pacePct();

  const pool = UI.progPeriod === 'semana' ? wSessions : S.sessions;
  const totalPool = pool.reduce((s, x) => s + x.minutes, 0);

  const bySubject = {};
  SUBJECTS.forEach(s => { bySubject[s.id] = 0; });
  pool.forEach(x => { bySubject[x.subjectId] = (bySubject[x.subjectId] || 0) + x.minutes; });
  const distMax = Math.max(1, ...Object.values(bySubject));

  /* últimos 7 dias */
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = addDaysIso(todayIso(), -i);
    const m = S.sessions.filter(s => s.date === d).reduce((s, x) => s + x.minutes, 0);
    days.push({ date: d, minutes: m });
  }
  const dayMax = Math.max(60, ...days.map(d => d.minutes));

  const concluded = SUBJECTS.map(s => ({
    s, n: S.topics.filter(t => t.subjectId === s.id && t.status === 'concluido' && !t.archived).length,
    total: S.topics.filter(t => t.subjectId === s.id && !t.archived).length,
  }));
  const totalConcluidos = S.topics.filter(t => t.status === 'concluido' && !t.archived).length;
  const totalAtivos = S.topics.filter(t => !t.archived).length;

  const hist = [...S.sessions].sort((a, b) => b.date.localeCompare(a.date) || String(b.id).localeCompare(String(a.id)));
  const shown = hist.slice(0, UI.histLimit);
  const totalTudo = S.sessions.reduce((s, x) => s + x.minutes, 0);

  return `
    <!-- Três cifras de ledger numa linha pautada. Sem caixa, sem sombra: o que
         as separa é o espaço e o alinhamento à direita. -->
    <section>
      <div class="rule"></div>
      <div class="grid grid-cols-1 gap-x-8 gap-y-5 py-4 sm:grid-cols-3">
        ${figure('Horas nesta semana', fmtMinutes(wm), `meta de ${fmtMinutes(gm)}, faltam ${fmtMinutes(Math.max(0, gm - wm))}`)}
        ${figure('Sessões registradas', String(S.sessions.length), `${wSessions.length} nesta semana, ${fmtMinutes(totalTudo)} no total`)}
        ${figure('Tópicos concluídos', String(totalConcluidos), `de ${totalAtivos} tópicos ativos`)}
      </div>
      <div class="rule"></div>
    </section>

    <section class="sec">
      ${sectionTitle('Meta da semana')}
      <div class="mt-4">${progressBar(wm, gm, p >= 100 ? 'var(--c-ok)' : 'var(--c-ink)', 6, pace)}</div>
      <div class="mt-4">
        ${[
          ['Meta', fmtMinutes(gm)],
          ['Ritmo esperado até hoje', `${Math.round(pace)}%`],
          ['Média diária nos últimos 7 dias', fmtMinutes(Math.round(days.reduce((s, d) => s + d.minutes, 0) / 7))],
        ].map(([rotulo, valor]) => `
          <div class="row flex items-baseline justify-between gap-6 py-2.5">
            <span class="t-body ink2">${esc(rotulo)}</span>
            <span class="shrink-0 t-body ink num">${esc(valor)}</span>
          </div>`).join('')}
      </div>
    </section>

    <section class="sec">
      <div class="sec-head mb-2.5">
        <h2 class="t-h2 ink">Tempo por matéria</h2>
        <span class="flex shrink-0 items-baseline gap-3">
          ${['semana', 'total'].map(k => `<button type="button" class="word" data-act="prog-period" data-period="${k}"
            aria-pressed="${UI.progPeriod === k}">${k === 'semana' ? 'esta semana' : 'total'}</button>`).join('')}
        </span>
      </div>
      ${totalPool ? `
      <div class="mt-1">
        ${SUBJECTS.filter(s => bySubject[s.id] > 0).sort((a, b) => bySubject[b.id] - bySubject[a.id]).map(s => {
          const m = bySubject[s.id], share = pct(m, totalPool);
          return `<div class="row flex flex-wrap items-center gap-4 py-2.5">
            <span class="flex w-24 shrink-0 items-baseline gap-2 sm:w-32">${subjectDot(s, 6)}<span class="truncate t-body ink2">${esc(s.name)}</span></span>
            <span class="min-w-0 flex-1">${progressBar(m, distMax, subjFill(s), 5)}</span>
            <span class="w-20 shrink-0 text-right t-meta ink num">${fmtMinutes(m)}</span>
            <span class="w-12 shrink-0 text-right t-hint num">${Math.round(share)}%</span>
          </div>`;
        }).join('')}
      </div>`
      : emptyState('chart-column', 'Sem dados neste período', 'Registre uma sessão para ver a distribuição por matéria.', '', 'sm')}
    </section>

    <section class="sec">
      ${sectionTitle('Últimos 7 dias')}
      <!-- O gráfico tem largura mínima própria: 7 rótulos de dia mais os vãos pedem 374px
           numa coluna de 320px a 200% de texto. Sem contenção, a barra de rolagem aparece
           na PÁGINA inteira; aqui ela fica no próprio gráfico — conteúdo 2D, permitido — e
           as barras e os rótulos rolam juntos, por serem filhos do mesmo bloco.
           A troca de mt-5 por mt-3 + pt-2 sobe a borda de recorte 8px acima do gráfico: a
           etiqueta da barra mais alta SOBRESSAI 4,5px do topo (é posicionada acima da
           barra) e seria decepada. Com h-[8.5rem] a caixa de conteúdo segue com 8rem, na
           mesma posição: 12+8 = 20px de margem, igual em qualquer escala de texto. -->
      <div class="mt-3 flex h-[8.5rem] flex-col pt-2 scroll-x">
        <div class="flex flex-1 items-end gap-2">
          ${days.map(d => {
            /* 82% de teto: sobra espaço para a etiqueta acima da barra mais alta.
               A barra é ESTREITA de propósito — coluna larga vira bloco sólido e
               passa a ser a coisa mais pesada da página; régua fina mede igual. */
            const alt = d.minutes ? Math.max(3, (d.minutes / dayMax) * 82) : 0;
            const hoje = d.date === todayIso();
            return `<div class="relative flex h-full flex-1 items-end justify-center">
              ${d.minutes ? `<span class="absolute inset-x-0 text-center t-hint num" style="bottom:calc(${alt}% + 5px)">${(d.minutes / 60).toFixed(1).replace('.0', '').replace('.', ',')}h</span>` : ''}
              <div style="width:12px;height:${alt}%;min-height:${d.minutes ? 2 : 0}px;background:${d.minutes ? (hoje ? 'var(--c-ink)' : 'var(--c-ink3)') : 'transparent'}"></div>
            </div>`;
          }).join('')}
        </div>
        <div class="rule mt-3"></div>
        <div class="mt-2 flex gap-2">
          ${days.map(d => `<span class="flex-1 text-center t-hint ${d.date === todayIso() ? 'ink' : ''}">${dayNameFromIso(d.date)}</span>`).join('')}
        </div>
      </div>
    </section>

    <section class="sec">
      ${sectionTitle('Tópicos concluídos por matéria')}
      <div class="mt-1">
        ${concluded.map(({ s, n, total }) => `
          <div class="row flex flex-wrap items-center gap-4 py-2.5">
            <span class="flex w-24 shrink-0 items-baseline gap-2 sm:w-32">${subjectDot(s, 6)}<span class="truncate t-body ink2">${esc(s.name)}</span></span>
            <span class="min-w-0 flex-1">${progressBar(n, Math.max(1, total), subjFill(s), 5)}</span>
            <span class="w-16 shrink-0 text-right t-meta ink num">${n}<span class="ink3">/${total}</span></span>
          </div>`).join('')}
      </div>
    </section>

    <section class="sec">
      ${sectionTitle('Histórico de sessões', hist.length ? `<span class="t-hint">${hist.length} ${hist.length === 1 ? 'sessão' : 'sessões'}</span>` : '')}
      ${hist.length ? `
      <div class="scroll-x mt-1">
        <table class="w-full min-w-[700px] text-left">
          <thead>
            <tr style="border-bottom:1px solid var(--c-rule)">
              <th class="py-2 pr-4 t-col">Data</th>
              <th class="py-2 pr-4 t-col">Matéria</th>
              <th class="py-2 pr-4 t-col">Tópico</th>
              <th class="py-2 pr-4 text-right t-col">Duração</th>
              <th class="py-2 pr-4 t-col">Tipo</th>
              <th class="py-2 pr-4 t-col">Observações</th>
              <th class="py-2 text-right t-col">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${shown.map(s => {
              const sub = subjectOf(s.subjectId);
              const t = s.topicId ? topicById(s.topicId) : null;
              return `<tr class="row group">
                <td class="whitespace-nowrap py-2.5 pr-4 t-meta ink2">${shortDate(s.date)} <span class="t-hint">${dayNameFromIso(s.date)}</span></td>
                <td class="whitespace-nowrap py-2.5 pr-4 t-meta">${subjectName(s.subjectId)}</td>
                <td class="min-w-[12ch] max-w-[12.5rem] py-2.5 pr-4 t-body ink">${esc(t ? t.name : 'Estudo avulso')}</td>
                <td class="whitespace-nowrap py-2.5 pr-4 text-right t-meta ink num">${fmtMinutes(s.minutes)}</td>
                <td class="whitespace-nowrap py-2.5 pr-4 t-meta ink2 italic">${esc(TYPES[s.type] || 'Teoria')}</td>
                <td class="min-w-[24ch] max-w-[15rem] py-2.5 pr-4 t-hint">${esc(s.notes || '—')}</td>
                <td class="whitespace-nowrap py-2.5 text-right">
                  <span class="inline-flex items-center gap-0.5 transition-opacity duration-150 md:opacity-0 md:group-hover:opacity-100 md:group-focus-within:opacity-100">
                    <button type="button" data-act="edit-session" data-id="${s.id}" class="${BTN_ICON} is-sm inline-grid" title="Editar" aria-label="Editar sessão"><i data-lucide="pencil" class="h-3.5 w-3.5"></i></button>
                    <button type="button" data-act="del-session" data-id="${s.id}" class="${BTN_ICON} is-sm is-danger inline-grid" title="Excluir" aria-label="Excluir sessão"><i data-lucide="trash-2" class="h-3.5 w-3.5"></i></button>
                  </span>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      ${hist.length > UI.histLimit ? `<div class="mt-4">
        <button type="button" class="${BTN_GHOST} btn-sm" data-act="more-history">Carregar mais ${hist.length - UI.histLimit}</button>
      </div>` : ''}`
      : emptyState('history', 'Nenhuma sessão registrada', 'Conclua uma atividade no dia ou registre um estudo não planejado para começar o histórico.', '', 'sm')}
    </section>`;
}

/* ---------------------------------------------------------------------------
   13. ABA 5 — AJUSTES
   ------------------------------------------------------------------------- */
function viewAjustes() {
  const temas = [
    { id: 'escuro', label: 'escuro' },
    { id: 'claro',  label: 'claro' },
  ];
  /* Ajustes como uma folha de configuração impressa: cada linha é um par
     rótulo/valor separado por fio. Os pares de pílula (tema, prioridade)
     viraram palavras em itálico com fio embaixo na ativa. */
  return `
    <section>
      ${sectionTitle('Aparência')}
      <div class="mt-1">
        <div class="row flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-3">
          <div class="min-w-0">
            <p class="t-body ink">Tema da interface</p>
            <p class="mt-0.5 t-hint">A escolha fica salva neste navegador.</p>
          </div>
          <span class="flex shrink-0 items-baseline gap-4">
            ${temas.map(t => `<button type="button" class="word" data-act="set-theme" data-theme="${t.id}"
              aria-pressed="${S.settings.theme === t.id}">${t.label}</button>`).join('')}
          </span>
        </div>

        <div class="row flex flex-wrap items-baseline justify-between gap-x-6 gap-y-2 py-3">
          <div class="min-w-0">
            <p class="t-body ink">Horas disponíveis por semana</p>
            <p class="measure mt-0.5 t-hint">Usado só para o aviso de sobrecarga no planejamento. Nada é bloqueado e nada é reagendado sozinho.</p>
          </div>
          <input type="number" min="1" max="168" step="0.5" value="${S.settings.weeklyAvailabilityHours}"
                 data-act="set-avail" class="${INP} w-24 shrink-0 text-right"
                 aria-label="Horas disponíveis por semana" />
        </div>
      </div>
    </section>

    <section class="sec">
      ${sectionTitle('Prioridade e matérias ativas', `<span class="t-hint">define a sugestão de distribuição da meta</span>`)}
      <div class="mt-1">
        <div class="hidden items-baseline gap-4 py-1.5 sm:flex">
          <span class="w-40 shrink-0 t-col">Matéria</span>
          <span class="flex min-w-0 flex-1 items-baseline gap-4 sm:justify-end">
            <span class="w-24 shrink-0 t-col">Prioridade</span>
            <span class="w-10 shrink-0 text-center t-col">Ativa</span>
          </span>
        </div>
        ${SUBJECTS.map(s => {
          const inactive = !isActiveSubject(s.id);

/* ---------------------------------------------------------------------------
   14. MODAIS DE AÇÃO

/* A data de uma sessão não pode estar no futuro. Uma sessão datada de 2030 não
   entra em nenhuma visão semanal (nem no "Horas nesta semana", nem nos 7 dias) e
   some do histórico — o usuário acha que registrou e o número não se move.
   O `max` no input é só a dica do seletor nativo: os botões destes modais são
   `type="button"` e chamam o handler direto, então NENHUMA validação do navegador
   roda e o `max` sozinho não bloqueia nada. A checagem tem de estar aqui.
   Devolve null quando a data é inválida ou futura. */
function dataDeSessao(valor, padrao) {
  const d = /^\d{4}-\d{2}-\d{2}$/.test(String(valor || '')) ? String(valor) : padrao;
  return d > todayIso() ? null : d;
}

/* ---------------------------------------------------------------------------
   APLICAR A SUGESTÃO
   ---------------------------------------------------------------------------
   A coluna "Sugerido" era só leitura: o usuário via 5h46m de Matemática e tinha
   de criar as atividades à mão, uma por uma, para chegar lá. Aqui a sugestão
   vira atividade — mas NADA acontece sozinho: abre-se uma prévia que mostra
   exatamente o que será criado, com o tamanho do bloco ajustável, e só o clique
   final cria. Tudo entra "sem dia fixo" (o encaixe nos dias continua sendo uma
   decisão sua) e distribuído pelos tópicos da matéria em ordem, para o esqueleto
   já ter variedade em vez de 6 blocos do mesmo tópico.
   -------------------------------------------------------------------------- */
function blocosDe(minutos, bloco) {
  const n = Math.max(1, Math.ceil(minutos / bloco));
  const out = [];
  let resta = minutos;
  for (let i = 0; i < n && resta > 0; i++) { const q = Math.min(bloco, resta); out.push(q); resta -= q; }
  return out;
}

/* Desenha a prévia dentro do modal já aberto. É chamada ao abrir e a cada
   mudança do tamanho do bloco, para a contagem nunca ficar velha. */
function pintarSugestao(bloco) {
  const alvo = $('#suggestion-preview');
  if (!alvo) return;
  const suggested = suggestedMinutesBySubject();
  const ativos = SUBJECTS.filter(s => isActiveSubject(s.id) && suggested[s.id] > 0);
  let total = 0;
  const linhas = ativos.map(s => {
    const m = suggested[s.id];
    const n = blocosDe(m, bloco).length;
    total += n;
    return `<div class="row flex items-baseline justify-between gap-6 py-1.5">
      <span class="flex min-w-0 items-baseline gap-2">${subjectDot(s, 6)}<span class="truncate t-body ink2">${esc(s.name)}</span></span>
      <span class="shrink-0 t-meta ink num">${fmtMinutes(m)} <span class="t-hint">em ${n} ${n === 1 ? 'bloco' : 'blocos'}</span></span>
    </div>`;
  }).join('');
  alvo.innerHTML = linhas || `<p class="t-hint italic">Nenhuma matéria ativa com sugestão.</p>`;
  const resumo = $('#suggestion-total');
  if (resumo) resumo.textContent = total
    ? `${total} ${total === 1 ? 'atividade' : 'atividades'}, todas sem dia fixo. Os tópicos entram em ordem — você ajusta cada uma depois em Editar.`
    : '';
}

/* ---------------------------------------------------------------------------
   IMPORTAR BACKUP
   ---------------------------------------------------------------------------
   Antes era uma linha: S = normalize(JSON.parse(texto)). `normalize` aceita
   QUALQUER objeto e sempre devolve um estado válido — mesmo que vazio. Então
   importar {"foo": 1} apagava tudo (56 tópicos, atividades e sessões iam a zero),
   a interface dizia "Backup importado." e o console ficava limpo. Perda de dados
   silenciosa, e sem desfazer.

   Agora o arquivo precisa PROVAR que é um backup antes de qualquer coisa: tem de
   ser um objeto com `topics` e `sessions` como listas — a assinatura que o próprio
   Exportar produz, e que nem {"foo": 1} nem {} conseguem imitar. E a troca deixou
   de ser automática: mostra o que veio dentro e oferece Mesclar ou Substituir, para
   que a decisão de apagar o que já existe seja explícita. */
function pareceBackup(o) {
  return !!o && typeof o === 'object' && !Array.isArray(o)
    && Array.isArray(o.topics) && Array.isArray(o.sessions);
}

let pendingImport = null;

/* União por id: o que já está aqui vence (uma edição local não pode ser
   sobrescrita por um arquivo antigo); do arquivo entra só o que não existe. */
function mesclarBackup(base, entrada) {
  const unir = (atuais, novos) => {
    const vistos = new Set(atuais.map(x => x.id));
    return [...atuais, ...novos.filter(x => !vistos.has(x.id))];
  };
  return normalize({
    version: 2,
    settings: base.settings,
    topics: unir(base.topics, entrada.topics),
    activities: unir(base.activities, entrada.activities),
    sessions: unir(base.sessions, entrada.sessions),
  });
}

function importModal(entrada) {
  pendingImport = normalize(entrada);
  const linhas = [
    ['Tópicos', pendingImport.topics.length],
    ['Atividades planejadas', pendingImport.activities.length],
    ['Sessões registradas', pendingImport.sessions.length],
  ].map(([rotulo, n]) => `<div class="row flex items-baseline justify-between gap-6 py-2">
      <span class="t-body ink2">${esc(rotulo)}</span>
      <span class="shrink-0 t-body ink num">${n}</span>
    </div>`).join('');
  modal({
    title: 'Importar backup',
    sub: 'Confira o que veio no arquivo antes de decidir',
    body: `${linhas}
      <p class="measure mt-4 t-hint">Mesclar mantém o que já está aqui e acrescenta o que só existe no arquivo. Substituir apaga tudo o que você tem hoje e deixa apenas o arquivo.</p>`,
    footer: `<button type="button" class="${BTN_GHOST}" data-act="close-modal">Cancelar</button>
             <button type="button" class="${BTN_GHOST}" data-act="import-merge">Mesclar</button>
             <button type="button" class="${BTN_PRI}" data-act="import-replace">Substituir</button>`,
  });
}

/* ---------------------------------------------------------------------------
   15. EVENTOS (delegação)
   ------------------------------------------------------------------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const id = el.dataset.id;

  if (act === 'modal-backdrop' && e.target === el) { closeModal(); return; }

  switch (act) {
    case 'tab':
      UI.tab = el.dataset.tab;
      window.scrollTo({ top: 0, behavior: 'smooth' });
      render();
      break;

    case 'set-theme':
      S.settings.theme = el.dataset.theme === 'claro' ? 'claro' : 'escuro';
      save(); applyTheme(); render();
      toast(S.settings.theme === 'claro' ? 'Tema claro ativo.' : 'Tema escuro ativo.');
      break;

    case 'close-modal':
      closeModal();
      break;

    case 'confirm-yes': {
      const fn = pendingConfirm; pendingConfirm = null;
      closeModal();
      if (typeof fn === 'function') fn();
      break;
    }

    /* ---- Hoje / Semana ---- */
    case 'complete': {
      const a = S.activities.find(x => x.id === id);
      if (!a) break;
      if (a.done) {
        confirmModal({
          title: 'Reabrir atividade?',
          text: 'Ela volta para as pendências. A sessão já registrada permanece no histórico — nada é apagado.',
          confirmLabel: 'Reabrir', danger: false,
          onConfirm: () => { a.done = false; a.doneAt = null; save(); render(); toast('Atividade reaberta.'); },
        });
      } else {
        completeModal(id);
      }
      break;
    }

    case 'submit-complete': {
      const form = $('form[data-act="save-complete"]');
      if (!form) break;
      const fd = new FormData(form);
      const a = S.activities.find(x => x.id === form.dataset.id);
      if (!a) break;
      const minutes = clamp(Math.round(Number(fd.get('minutes')) || a.plannedMinutes), 1, 1440);
      const date = dataDeSessao(fd.get('date'), todayIso());
      if (!date) { toast('A data não pode estar no futuro.', 'error'); break; }
      S.sessions.push({
        id: uid(), date, subjectId: a.subjectId, topicId: a.topicId,
        minutes, type: fd.get('type') || 'teoria',
        notes: String(fd.get('notes') || '').trim(), activityId: a.id,
      });
      /* O PLANO NÃO É REESCRITO. Era aqui que o defeito nascia: a.minutes = minutes
         fazia o "Planejado nesta semana" passar a somar o REALIZADO, então o plano
         mudava sozinho ao concluir. O real fica na SESSÃO (acima), ligada por
         activityId; o plano permanece exatamente o que você digitou. */
      a.done = true; a.doneAt = Date.now();
      const t = topicById(a.topicId);
      if (t) t.status = fd.get('topicStatus') || t.status;
      save(); closeModal(); render();
      toast(`Sessão registrada: ${fmtMinutes(minutes)}`);
      break;
    }

    case 'unplanned':
      unplannedModal();
      break;

    case 'submit-unplanned': {
      const form = $('form[data-act="save-unplanned"]');
      if (!form) break;
      const fd = new FormData(form);
      const subjectId = fd.get('subjectId');
      if (!subjectId) { toast('Selecione uma matéria.', 'error'); break; }
      const minutes = clamp(Math.round(Number(fd.get('minutes')) || 0), 1, 1440);
      const date = dataDeSessao(fd.get('date'), todayIso());
      if (!date) { toast('A data não pode estar no futuro.', 'error'); break; }
      S.sessions.push({
        id: uid(), date, subjectId,
        topicId: fd.get('topicId') || null, minutes,
        type: fd.get('type') || 'teoria', notes: String(fd.get('notes') || '').trim(), activityId: null,
      });
      save(); closeModal(); render();
      toast(`Estudo avulso registrado: ${fmtMinutes(minutes)}`);
      break;
    }

    case 'new-activity':
      activityModal({ day: el.dataset.day === undefined || el.dataset.day === '' ? null : clamp(Number(el.dataset.day), 0, 6) });
      break;

    case 'edit-activity':
      activityModal({ id });
      break;

    case 'submit-activity': {
      const form = $('form[data-act="save-activity"]');
      if (!form) break;
      const fd = new FormData(form);
      const topicId = fd.get('topicId');
      const topic = topicById(topicId);
      if (!topic) { toast('Selecione um tópico válido.', 'error'); break; }
      const day = fd.get('day') === '' ? null : clamp(Number(fd.get('day')), 0, 6);
      const minutes = clamp(Math.round(Number(fd.get('minutes')) || 60), 5, 1440);
      const priority = PRIORITY[fd.get('priority')] ? fd.get('priority') : 'media';

      const alvo = form.dataset.id ? S.activities.find(x => x.id === form.dataset.id) : null;
      if (alvo) {
        /* Editar NÃO mexe no weekKey: a atividade continua na semana em que foi
           planejada mesmo que você mude o dia dela. E o plano é gravado em
           plannedMinutes — o realizado nunca é tocado por aqui. */
        alvo.topicId = topicId; alvo.subjectId = topic.subjectId;
        alvo.plannedMinutes = minutes; alvo.priority = priority; alvo.day = day;
        save(); closeModal(); render();
        toast('Atividade atualizada.');
      } else {
        S.activities.push({
          id: uid(), topicId, subjectId: topic.subjectId,
          plannedMinutes: minutes, priority, day,
          weekKey: weekKeyOf(), done: false, doneAt: null,
        });
        save(); closeModal(); render();
        toast(day === null ? 'Atividade criada sem dia fixo.' : `Atividade criada para ${DAYS[day]}.`);
      }
      break;
    }

    case 'apply-suggestion':
      applySuggestionModal();
      break;

    case 'submit-suggestion': {
      const formSug = $('form[data-act="save-suggestion"]');
      const bloco = clamp(Math.round(Number(formSug && formSug.querySelector('input[name="block"]').value) || 60), 15, 240);
      const suggested = suggestedMinutesBySubject();
      const ativos = SUBJECTS.filter(s => isActiveSubject(s.id) && suggested[s.id] > 0);
      if (!ativos.length) { toast('Nenhuma matéria ativa com sugestão.', 'error'); break; }

      let criadas = 0;
      ativos.forEach(s => {
        const topicos = visibleTopics(s.id);
        if (!topicos.length) return;
        blocosDe(suggested[s.id], bloco).forEach((q, i) => {
          S.activities.push({
            id: uid(), topicId: topicos[i % topicos.length].id, subjectId: s.id,
            plannedMinutes: q, priority: S.settings.priorities[s.id] || 'media',
            day: null, weekKey: weekKeyOf(), done: false, doneAt: null,
          });
          criadas++;
        });
      });
      save(); closeModal(); render();
      toast(criadas === 1 ? '1 atividade criada sem dia fixo.' : `${criadas} atividades criadas sem dia fixo.`);
      break;
    }

    case 'del-activity': {
      const a = S.activities.find(x => x.id === id);
      if (!a) break;
      confirmModal({
        title: 'Remover atividade?',
        text: 'A atividade sai do planejamento. Sessões já registradas no histórico não são afetadas.',
        confirmLabel: 'Remover',
        onConfirm: () => {
          S.activities = S.activities.filter(x => x.id !== id);
          save(); render(); toast('Atividade removida.');
        },
      });
      break;
    }

    case 'carry-all':
      confirmModal({
        title: 'Trazer atividades antigas?',
        text: 'As atividades não concluídas de semanas anteriores entram nesta semana como "Sem dia fixo". Você poderá reagendá-las depois.',
        confirmLabel: 'Trazer',
        danger: false,
        onConfirm: () => {
          pastOpenActivities().forEach(a => { a.weekKey = weekKeyOf(); a.day = null; });
          save(); render(); toast('Atividades trazidas para esta semana.');
        },
      });
      break;

    /* ---- Conteúdos ---- */
    case 'toggle-archived': {
      const sub = el.dataset.subject;
      UI.showArchived[sub] = !UI.showArchived[sub];
      render();
      break;
    }

    case 'archive-topic': {
      const t = topicById(id);
      if (!t) break;
      t.archived = !t.archived;
      save(); render();
      toast(t.archived ? 'Tópico arquivado (histórico preservado).' : 'Tópico restaurado.');
      break;
    }

    case 'del-topic': {
      const t = topicById(id);
      if (!t) break;
      confirmModal({
        title: 'Excluir tópico?',
        text: `Isso remove "${t.name}" e suas atividades planejadas. O histórico de sessões é preservado, mas o vínculo com o tópico será perdido. Para apenas esconder, use Arquivar.`,
        confirmLabel: 'Excluir',
        onConfirm: () => {
          S.topics = S.topics.filter(x => x.id !== id);
          S.activities = S.activities.filter(a => a.topicId !== id);
          S.sessions.forEach(s => { if (s.topicId === id) s.topicId = null; });
          save(); render(); toast('Tópico excluído.');
        },
      });
      break;
    }

    case 'edit-topic':
      editTopicModal(id);
      break;

    case 'submit-topic-edit': {
      const form = $('form[data-act="save-topic"]');
      if (!form) break;
      const fd = new FormData(form);
      const t = topicById(form.dataset.id);
      if (!t) break;
      const name = String(fd.get('name') || '').trim();
      const subjectId = fd.get('subjectId');
      if (!name) { toast('O nome não pode ficar vazio.', 'error'); break; }
      t.name = name;
      if (SUBJECT_MAP[subjectId] && subjectId !== t.subjectId) {
        t.subjectId = subjectId;
        S.activities.forEach(a => { if (a.topicId === t.id) a.subjectId = subjectId; });
      }
      save(); closeModal(); render(); toast('Tópico atualizado.');
      break;
    }

    /* ---- Progresso ---- */
    case 'prog-period':
      UI.progPeriod = el.dataset.period;
      render();
      break;

    case 'more-history':
      UI.histLimit += 30;
      render();
      break;

    case 'edit-session':
      editSessionModal(id);
      break;

    case 'submit-session-edit': {
      const form = $('form[data-act="save-session"]');
      if (!form) break;
      const fd = new FormData(form);
      const s = S.sessions.find(x => x.id === form.dataset.id);
      if (!s) break;
      const date = dataDeSessao(fd.get('date'), s.date);
      if (!date) { toast('A data não pode estar no futuro.', 'error'); break; }
      s.date = date;
      s.minutes = clamp(Math.round(Number(fd.get('minutes')) || s.minutes), 1, 1440);
      s.type = TYPES[fd.get('type')] ? fd.get('type') : s.type;
      s.notes = String(fd.get('notes') || '').trim();
      save(); closeModal(); render(); toast('Sessão atualizada.');
      break;
    }

    case 'del-session': {
      const s = S.sessions.find(x => x.id === id);
      if (!s) break;
      confirmModal({
        title: 'Excluir sessão?',
        text: `Remove o registro de ${fmtMinutes(s.minutes)} de ${shortDate(s.date)}. Esta ação não pode ser desfeita.`,
        confirmLabel: 'Excluir',
        onConfirm: () => {
          S.sessions = S.sessions.filter(x => x.id !== id);
          save(); render(); toast('Sessão excluída.');
        },
      });
      break;
    }

    /* ---- Ajustes ---- */
    case 'toggle-subject': {
      const sub = el.dataset.subject;
      const list = S.settings.activeSubjects;
      if (list.includes(sub)) {
        if (list.length <= 1) { toast('Mantenha ao menos uma matéria ativa.', 'error'); break; }
        S.settings.activeSubjects = list.filter(x => x !== sub);
      } else {
        S.settings.activeSubjects = [...list, sub];
      }
      save(); render();
      break;
    }

    case 'export': {
      try {
        const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `rotina-ita-${todayIso()}.json`;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        toast('Backup exportado.');
      } catch (err) { toast('Não foi possível exportar.', 'error'); }
      break;
    }

    case 'import': {
      const input = $('#import-file');
      if (input) input.click();
      break;
    }

    case 'import-merge': {
      if (!pendingImport) { toast('Nada para importar.', 'error'); break; }
      const n = mesclarBackup(S, pendingImport);
      const ganho = {
        t: n.topics.length - S.topics.length,
        a: n.activities.length - S.activities.length,
        s: n.sessions.length - S.sessions.length,
      };
      S = n; pendingImport = null;
      save(); closeModal(); applyTheme(); UI.tab = 'hoje'; render();
      toast(ganho.t + ganho.a + ganho.s === 0
        ? 'Nada novo no arquivo — tudo o que veio já estava aqui.'
        : `Backup mesclado: +${ganho.t} tópicos, +${ganho.a} atividades, +${ganho.s} sessões.`);
      break;
    }

    case 'import-replace': {
      if (!pendingImport) { toast('Nada para importar.', 'error'); break; }
      S = pendingImport; pendingImport = null;
      save(); closeModal(); applyTheme(); UI.tab = 'hoje'; render();
      toast('Backup substituído.');
      break;
    }

    case 'reset':
      confirmModal({
        title: 'Zerar aplicação?',
        text: 'Todos os tópicos, atividades, sessões, metas e prioridades serão apagados, e o banco de tópicos voltará ao padrão. O tema escolhido é mantido. Esta ação não pode ser desfeita.',
        confirmLabel: 'Zerar tudo',
        onConfirm: () => {
          const tema = S.settings.theme;
          S = defaultState();
          S.settings.theme = tema;
          save(); applyTheme(); UI.tab = 'hoje'; render(); toast('Aplicação reiniciada.');
        },
      });
      break;
  }
});

/* O evento `input` (a cada tecla) só serve para UMA coisa aqui: manter a prévia da
   sugestão verdadeira enquanto você digita o tamanho do bloco. Só `change` estava
   ligado, então a contagem ("26 atividades") ficava velha até o campo perder o
   foco — e a prévia é justamente o que você confere antes de autorizar a criação.
   O escopo é estreito de propósito: um `input` que chamasse `render()` (como fazem
   os handlers de `change`) arrancaria o foco do campo a cada tecla digitada. Aqui
   só se redesenha o miolo da prévia, nunca o campo. */
document.addEventListener('input', e => {
  const el = e.target.closest('[data-act="suggestion-block"]');
  if (!el) return;
  pintarSugestao(clamp(Math.round(Number(el.value) || 60), 15, 240));
});

document.addEventListener('change', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;

  if (act === 'set-status') {
    const t = topicById(el.dataset.id);
    if (t && STATUS[el.value]) { t.status = el.value; save(); render(); }
    return;
  }
  if (act === 'set-prio') {
    if (PRIORITY[el.value]) { S.settings.priorities[el.dataset.subject] = el.value; save(); render(); }
    return;
  }
  if (act === 'set-goal') {
    S.settings.weeklyGoalHours = clamp(Number(el.value) || 0, 0, 168);
    save(); render();
    return;
  }
  if (act === 'set-avail') {
    S.settings.weeklyAvailabilityHours = clamp(Number(el.value) || 0, 1, 168);
    save(); render();
    return;
  }
  if (act === 'subject-select') {
    const sel = $('#unplanned-topics');
    if (sel) { sel.innerHTML = topicOptionsFor(el.value); paint(); }
    return;
  }
  if (act === 'suggestion-block') {
    pintarSugestao(clamp(Math.round(Number(el.value) || 60), 15, 240));
    return;
  }
  if (act === 'import-file' && el.files && el.files[0]) {
    const file = el.files[0];
    const reader = new FileReader();
    reader.onload = () => {
      let entrada = null;
      try { entrada = JSON.parse(String(reader.result)); }
      catch (err) { toast('O arquivo não é um JSON válido.', 'error'); return; }
      /* Nada é trocado antes desta checagem — é ela que impede a perda silenciosa. */
      if (!pareceBackup(entrada)) {
        toast('Este arquivo não é um backup da Rotina ITA. Nada foi alterado.', 'error');
        return;
      }
      importModal(entrada);
    };
    reader.readAsText(file);
    el.value = '';
    return;
  }
});

document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-act]');
  if (!form) return;
  e.preventDefault();

  if (form.dataset.act === 'add-topic') {
    const input = form.querySelector('input[name="name"]');
    const name = String(input.value || '').trim();
    if (!name) return;
    S.topics.push({ id: uid(), subjectId: form.dataset.subject, name, status: 'nao_iniciado', archived: false, createdAt: Date.now() });
    save(); render(); toast('Tópico criado.');
    const again = $(`form[data-act="add-topic"][data-subject="${form.dataset.subject}"] input[name="name"]`);
    if (again) again.focus();
    return;
  }

  /* O handler do formulário "add-activity" saiu junto com o formulário: criar
     atividade agora passa pelo modal único (case 'submit-activity'). */
});

document.addEventListener('keydown', e => {
  const raiz = $('#modal-root');
  if (raiz.classList.contains('hidden')) return;
  if (e.key === 'Escape') { closeModal(); return; }

  /* Prende o Tab dentro do diálogo. `aria-modal` só diz ao leitor de tela para tratar
     o fundo como inerte; ele NÃO impede o foco de sair. Sem esta guarda, o usuário de
     teclado tabula para fora do diálogo e alcança os controles da página encoberta —
     e pode acioná-los. */
  if (e.key !== 'Tab') return;
  const focaveis = [...raiz.querySelectorAll(
    'a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'
  )].filter(el => el.getClientRects().length > 0);
  if (!focaveis.length) { e.preventDefault(); return; }

  const primeiro = focaveis[0], ultimo = focaveis[focaveis.length - 1];
  const ativo = document.activeElement;
  const dentro = raiz.contains(ativo);
  if (e.shiftKey) {
    if (!dentro || ativo === primeiro) { e.preventDefault(); ultimo.focus(); }
  } else if (!dentro || ativo === ultimo) {
    e.preventDefault(); primeiro.focus();
  }
});

/* ---------------------------------------------------------------------------
   16. BOOT
   ------------------------------------------------------------------------- */
applyTheme();
save();   /* grava o estado (inclusive o seed inicial) para IDs estáveis */
render();
</script>
</body>
