<style>
  /* ==========================================================================
     ROTINA ITA — CADERNO PAUTADO
     --------------------------------------------------------------------------
     A tese: este não é um painel, é um caderno de estudo impresso. Três
     consequências, e todas as decisões abaixo saem delas:

     1. A ÚNICA cor da interface pertence às matérias. Não existe cor de
        "accent" para botão, aba ou foco — chrome é tinta e régua. Seis matizes
        já carregam informação; um sétimo só competiria com elas.
     2. A RÉGUA carrega a estrutura; a SUPERFÍCIE é reservada ao que flutua
        (modal, aviso, dropdown, vazio). Nada de card em tudo.
     3. UMA serifada, uma voz. Hierarquia vem de corpo, peso e itálico — não de
        caixa alta, de rótulo-sobrancelha nem de ponto médio.

     Tipografia: Literata (variável 300–700, romano + itálico, opsz 7–72).
     Escolhida por três razões funcionais, não estéticas: contraste de traço
     moderado (uma didone ficaria espinhosa sobre o navy escuro), altura-x
     grande (aguenta 11–12px) e numerais tabulares reais (as cifras alinham).
     ========================================================================== */

  :root {
    /* --- papel e superfície --- */
    --c-page:        #0B0F19;   /* navy profundo — fixado no brief original */
    --c-page-a:      rgba(11, 15, 25, .94);
    --c-leaf:        #141924;   /* superfície que flutua */
    --c-leaf-2:      #1A2030;
    --c-well:        #0E131D;   /* poço: campos, trilhos */
    --c-track:       #3A455C;   /* 2,0:1 sobre a PÁGINA. Era #2C3547, que media
                                   1,56:1 — abaixo do limiar em que um traço se
                                   percebe como traço. O trilho é a fronteira do
                                   objeto gráfico (1.4.11). */

    /* --- réguas: o elemento ESTRUTURAL ---
       Medido antes: `--c-rule` dava 1,49:1 sobre a página e `--c-rule-soft`,
       1,28:1. O comentário acima dizia que as réguas eram "o elemento
       estrutural, não um sussurro" — e o valor era o mesmo 1,49:1 que a nota do
       interruptor (abaixo) chama de baixo demais para se distinguir do papel.
       O princípio já estava escrito neste arquivo; faltava aplicá-lo à régua.
       Agora: o fio de seção (que DELIMITA) vai a 3:1; o separador de linha (que
       apenas SEPARA, e são 56 em Conteúdos) vai a 2:1 — 56 fios a 3:1 viram
       grade de planilha e matam a leveza. A hierarquia entre os dois é
       preservada de propósito. Medir de novo antes de trocar qualquer um. */
    --c-rule:        #515F7E;   /* 3,0:1 sobre #0B0F19 */
    --c-rule-soft:   #39465C;   /* 2,0:1 sobre #0B0F19 */

    /* --- contorno do interruptor DESLIGADO ---
       Com `--c-rule` o contorno dava 1,49:1 sobre a página: o interruptor
       desligado não se distinguia do papel e parecia um controle inativo (o
       desabilitado é `opacity:.4`). A fronteira do controle precisa de 3:1
       (1.4.11). Desligado = contorno visível e vazio; ligado = tinta cheia. */
    --c-sw-off:      #5A6376;   /* 3,17:1 sobre #0B0F19 */

    /* --- tinta ---
       Branco quente, não o branco-azulado de antes: sobre serifada, o azulado
       cintila e a página fica fria. E 15,5:1 em vez de 17,5:1 — serifada com
       contraste máximo sobre fundo escuro incomoda na leitura longa. */
    --c-ink:         #EAE7E0;
    --c-ink2:        #A8AFBC;
    --c-ink3:        #7E8796;

    /* --- semânticos (estados: a única cor além das matérias) --- */
    --c-ok:          #4ADE9B;
    --c-warn:        #E5B567;
    --c-danger:      #F08A8A;

    /* --- utilidades --- */
    --c-hi:          rgba(255, 255, 255, .04);
    --c-scroll:      #242C3D;
    --c-scroll-h:    #33405A;

    /* --- escala tipográfica (razão ~1,25 + degraus de chrome) --- */
    --fs-display: 2.5rem;    /* 40 — a cifra da semana: o único momento alto */
    --fs-h1:      1.625rem;  /* 26 — o título da tela */
    --fs-h2:      1.125rem;  /* 18 — cabeçalho de seção */
    --fs-num:     1.375rem;  /* 22 — cifra de destaque */
    --fs-body:    0.9375rem; /* 15 */
    --fs-meta:    0.8125rem; /* 13 */
    --fs-small:   0.75rem;   /* 12 — chrome */
    --fs-micro:   0.6875rem; /* 11 — só dica */

    /* --- entrelinha: UMA por corpo ---
       Medido antes desta passagem: 12 entrelinhas distintas para 8 corpos. A
       causa não era a escala, eram os COMPONENTES redeclarando `line-height`
       por cima dela — `.t-col` e `.t-field` cravavam 1.3, `.btn` 1.4, `.word`
       não declarava nada e herdava 1.5 de um `.t-meta` acima. Resultado: 12px
       renderizava com QUATRO entrelinhas (15,6 / 16,8 / 17,4 / 18px), e a mesma
       caixa de 12px tinha quatro alturas diferentes conforme o lugar.

       A regra: nenhum componente crava entrelinha. Todo mundo referencia o
       token do SEU corpo. Se um controle precisa de caixa mais justa, quem
       muda é o padding, não a entrelinha. */
    --lh-display: 1.0;
    --lh-h1:      1.15;
    --lh-h2:      1.25;
    --lh-num:     1.1;
    --lh-body:    1.62;      /* serifada pede mais entrelinha que a sans */
    --lh-meta:    1.5;
    --lh-small:   1.45;
    --lh-hint:    1.45;
    --measure: 62ch;         /* teto de leitura, bem abaixo dos 80ch */

    /* --- largura da PÁGINA (não do texto) ---
       Medido: com a coluna em 960px, o rótulo e o valor da MESMA linha ficavam a
       896px um do outro (pior caso: "Meta" → "25h"). Ler a linha custava 2,2× a
       medida de leitura que este arquivo fixou para o texto — o olho perde a
       associação entre as duas pontas. Varredura de 960→536px de conteúdo: o vão
       cai linearmente (896 → 472) porque o valor é alinhado à direita. Em 42rem
       (672px de página, 608px de conteúdo) o vão máximo é 544px — dentro de uma
       saccade. O caderno tem UMA largura: cabeçalho, índice e texto estreitam
       juntos, e a régua de seção corre até esta margem, não até a da janela. */
    --page: 42rem;

    /* --- escala de ESPAÇO ---
       O layout é feito com utilitárias do Tailwind, cuja escala é 4px com
       meio-degrau de 2px. Estes tokens são o RITMO — os degraus que separam
       blocos — e não o respiro interno de um controle.

       A REGRA vale para os dois: todo espaço é múltiplo de 2px. Medido antes
       desta passagem, havia 16 valores distintos e QUATRO fora do passo, todos
       cravados à mão dentro de componentes: 3px (.sec-head, .nav-btn), 5px
       (.btn-sm, .nav-btn), 7px (.btn, .inp, .nav-btn) e 13px (.btn). E o ritmo
       de seção usava TRÊS valores para a mesma função — 36px entre seções, 28px
       no topo da página e 32px no cartão de abertura e no aviso de sobrecarga.
       Agora 36px é o passo entre seções, e ponto.

       Antes de acrescentar um degrau, meça: se o valor não estiver nesta lista,
       provavelmente é um controle mal dimensionado, não um degrau novo. */
    --sp-1:  0.25rem;   /*  4 — respiro mínimo */
    --sp-2:  0.5rem;    /*  8 — dentro de um bloco */
    --sp-3:  0.75rem;   /* 12 — entre linhas afins */
    --sp-4:  1rem;      /* 16 — entre sub-blocos */
    --sp-5:  1.5rem;    /* 24 — entre blocos */
    --sp-6:  2.25rem;   /* 36 — entre SEÇÕES: o passo do caderno */
  }

  html.claro {
    --c-page:        #F6F7FA;
    --c-page-a:      rgba(246, 247, 250, .94);
    --c-leaf:        #FFFFFF;
    --c-leaf-2:      #F1F3F8;
    --c-well:        #F4F6FA;
    --c-track:       #ADB1BA;   /* 2,0:1 sobre o papel claro */

    --c-rule:        #8C9096;   /* 3,0:1 — era #D8DDE6, que media 1,27:1 */
    --c-rule-soft:   #AFB1B6;   /* 2,0:1 — era #E7EAF0, que media 1,12:1.
                                   Derivados da cor ORIGINAL por escala em
                                   espaço linear: mantêm o matiz azulado do
                                   papel (#F6F7FA). Escalar em sRGB dessatura e
                                   a régua vira um cinza frio, alheio ao papel. */

    --c-sw-off:      #858C99;   /* 3,16:1 sobre #F6F7FA */

    --c-ink:         #14161C;
    --c-ink2:        #4E5563;  /* 6,9:1 sobre o poço #F4F6FA */
    --c-ink3:        #636A78;  /* 5,0:1 — era #767D8B, dava 3,86:1 e reprovava
                                  em TODO texto de apoio (11px) e rótulo de
                                  coluna. Texto pequeno não tem isenção. */

    --c-ok:          #047857;
    --c-warn:        #92400E;
    --c-danger:      #B91C1C;

    --c-hi:          rgba(255, 255, 255, 0);
    --c-scroll:      #D7DCE6;
    --c-scroll-h:    #BFC7D6;
  }

  /* --------------------------------------------------------------------------
     BASE
     -------------------------------------------------------------------------- */
  html { -webkit-tap-highlight-color: transparent; }
  body {
    font-family: Literata, Georgia, 'Times New Roman', serif;
    font-optical-sizing: auto;
    font-size: var(--fs-body);
    line-height: var(--lh-body);
    background: var(--c-page);
    color: var(--c-ink);
    font-variant-numeric: tabular-nums;
  }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--c-page); }
  ::-webkit-scrollbar-thumb { background: var(--c-scroll); border-radius: 999px; border: 2px solid var(--c-page); }
  ::-webkit-scrollbar-thumb:hover { background: var(--c-scroll-h); }
  ::selection { background: var(--c-rule); color: var(--c-ink); }

  /* foco de teclado: a tinta, não uma cor de marca */
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--c-ink); outline-offset: 2px; border-radius: 3px; }

  /* --------------------------------------------------------------------------
     TIPOGRAFIA — uma família, hierarquia por corpo/peso/estilo
     -------------------------------------------------------------------------- */
  .t-display { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 500; letter-spacing: -.015em; }
  .t-h1      { font-size: var(--fs-h1);      line-height: var(--lh-h1);      font-weight: 500; letter-spacing: -.01em; }
  .t-h2      { font-size: var(--fs-h2);      line-height: var(--lh-h2);      font-weight: 500; }
  .t-num     { font-size: var(--fs-num);     line-height: var(--lh-num);     font-weight: 500; letter-spacing: -.01em; }
  .t-body    { font-size: var(--fs-body);    line-height: var(--lh-body); }
  .t-meta    { font-size: var(--fs-meta);    line-height: var(--lh-meta);    color: var(--c-ink2); }
  .t-small   { font-size: var(--fs-small);   line-height: var(--lh-small); }
  .t-hint    { font-size: var(--fs-micro);   line-height: var(--lh-hint);    color: var(--c-ink3); }

  /* o cabeçalho de coluna de uma tabela impressa: itálico, frase, não caixa alta */
  .t-col     { font-size: var(--fs-small); line-height: var(--lh-small); font-style: italic; color: var(--c-ink3); }
  /* rótulo de campo: frase normal, tinta secundária — sem versalete */
  .t-field   { font-size: var(--fs-small); line-height: var(--lh-small); font-weight: 500; color: var(--c-ink2); }

  .ink  { color: var(--c-ink); }
  .ink2 { color: var(--c-ink2); }
  .ink3 { color: var(--c-ink3); }
  .num  { font-variant-numeric: tabular-nums; }
  .measure { max-width: var(--measure); }
  /* A página inteira (cabeçalho + índice + texto) obedece a `--page`. Substitui o
     `max-w-5xl` que dava 960px de conteúdo — ver a nota do token, acima. */
  .page { max-width: var(--page); }

  /* O passo entre seções. Era `mt-9` (36px) em 16 lugares, `mb-8` (32px) em
     dois — três valores para a mesma função. Agora é um token só. O `.sec-top`
     é para o bloco que abre a aba: ali o espaço vai embaixo, não em cima. */
  .sec     { margin-top: var(--sp-6); }
  .sec-top { margin-bottom: var(--sp-6); }

  /* --------------------------------------------------------------------------
     ESTRUTURA — régua em vez de card
     -------------------------------------------------------------------------- */
  /* Cabeçalho de seção: título + fio que corre até a margem direita.
     O fio não é enfeite: ele diz onde a seção começa e onde termina. */
  .sec-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--sp-1) 14px; }
  .sec-head::after {
    content: ''; flex: 1 1 auto; height: 1px; min-width: 16px;
    background: var(--c-rule); align-self: center;
  }
  /* Todo filho do cabeçalho pode ENCOLHER. Antes era `flex: none` em todos, com exceção
     só para o h2 — então o `right` (a dica em .t-hint) não encolhia, e a 200% de texto a
     dica de "Prioridade e matérias ativas" (421px) estourava um viewport de 400px
     (medido: scrollWidth 461 × clientWidth 400). Com `flex: 0 1 auto` + `min-width: 0`
     a dica desce para a linha de baixo. O fio (::after) segue sendo o único item que
     CRESCE. Em 100% nada muda — medido byte a byte em 1080px nas cinco abas. */
  .sec-head > * { flex: 0 1 auto; min-width: 0; }

  .rule       { height: 1px; background: var(--c-rule); }
  .rule-soft  { height: 1px; background: var(--c-rule-soft); }

  /* linha de ledger: separada por fio, nunca por caixa */
  .row { border-top: 1px solid var(--c-rule-soft); }
  .row:first-child { border-top: 0; }

  /* trilho da matéria: a cor entra como fio de 2px à esquerda da linha */
  .rail { position: relative; }
  .rail::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px;
    background: var(--rail, transparent);
  }

  /* superfície: SÓ para o que flutua sobre a página ou para o vazio que
     precisa de contorno (modal, aviso, dropdown, estado vazio) */
  .leaf { background: var(--c-leaf); border: 1px solid var(--c-rule); }
  .well { background: var(--c-well); }

  .nav-bg { background: var(--c-page-a); }
  /* Aqui havia um `.dashed { border: 1px dashed var(--c-rule); }`. Removido: a classe
     nunca foi usada — zero referências em markup e em JS, verificado por grep. Era o
     único CSS morto do arquivo. Se um dia precisar de um contorno tracejado, ele volta
     daqui, e volta junto com o uso. */

  /* --------------------------------------------------------------------------
     CONTROLES
     -------------------------------------------------------------------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2);
    border-radius: 5px; padding: var(--sp-2) 14px;
    font-family: inherit; font-size: var(--fs-small); font-weight: 500; line-height: var(--lh-small);
    border: 1px solid transparent; cursor: pointer;
    transition: background .18s ease, border-color .18s ease, color .18s ease;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  /* primário = tinta sólida. Sem cor de marca: o contraste é o destaque. */
  .btn-pri { background: var(--c-ink); color: var(--c-page); border-color: var(--c-ink); }
  .btn-pri:hover { background: var(--c-ink2); border-color: var(--c-ink2); }
  .btn-ghost { background: transparent; border-color: var(--c-rule); color: var(--c-ink2); }
  .btn-ghost:hover { border-color: var(--c-ink3); color: var(--c-ink); }
  .btn-danger { background: transparent; border-color: var(--c-rule); color: var(--c-danger); }
  .btn-danger:hover { border-color: var(--c-danger); }
  .btn-sm { padding: 6px 10px; font-size: var(--fs-micro); line-height: var(--lh-hint); }
  /* Caixa em rem, não em px. O ícone dentro é dimensionado em rem (h-4 / h-3.5) e por
     isso ACOMPANHA o tamanho de texto que o usuário escolher. Com a caixa cravada em
     30px, a 200% de texto o glifo virava 28px dentro de uma caixa de 26px: ele escapava
     da própria área de clique, e a área visível deixava de corresponder ao alvo. Em rem
     os dois crescem juntos. Em 100% (raiz 16px) dá exatamente 30px e 26px — a aparência
     não muda; a mudança só aparece para quem redimensiona o texto. */
  .btn-icon {
    display: grid; place-items: center; width: 1.875rem; height: 1.875rem; border-radius: 0.3125rem;
    border: 0; background: transparent; color: var(--c-ink3); cursor: pointer;
    transition: color .16s ease, background .16s ease;
  }
  .btn-icon:hover { color: var(--c-ink); background: var(--c-hi); }
  .btn-icon.is-danger:hover { color: var(--c-danger); }
  .btn-icon.is-sm { width: 1.625rem; height: 1.625rem; }

  .inp {
    width: 100%; border-radius: 5px; border: 1px solid var(--c-rule);
    background: var(--c-well); color: var(--c-ink);
    padding: var(--sp-2) 10px; font-family: inherit; font-size: var(--fs-meta);
    line-height: var(--lh-meta); transition: border-color .18s ease;
  }
  .inp::placeholder { color: var(--c-ink3); font-style: italic; }
  .inp:hover { border-color: var(--c-ink3); }
  .inp:focus { border-color: var(--c-ink); box-shadow: none; }
  .inp:disabled { opacity: .45; cursor: not-allowed; }
  .inp-sm { padding: 4px 8px; font-size: var(--fs-small); border-radius: 4px; }
  select.inp { cursor: pointer; }

  /* controle que se lê como TEXTO: o status do tópico, a prioridade.
     Itálico, sem caixa — é um valor, não um botão. */
  /* `min-height: 24px` é o piso de alvo da 2.5.8. O select media 22px de altura:
     passava pela exceção de espaçamento, mas é o controle mais repetido da
     aplicação (56× só em Conteúdos) e no toque era pequeno demais. */
  .inp-quiet {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font-family: inherit; font-size: var(--fs-small); font-style: italic;
    color: var(--c-ink2); padding: 2px 14px 2px 2px; border-radius: 3px; min-height: 24px;
    background-repeat: no-repeat; background-position: right 2px center;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%237E8796' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  }
  .inp-quiet:hover { color: var(--c-ink); }
  .inp-quiet:focus-visible { outline: 2px solid var(--c-ink); outline-offset: 1px; }
  /* A seta é um data-URI: não aceita `var()`, então a cor tem de ser repetida
     aqui. Era #767D8B — a cor que este arquivo já tinha REJEITADO para
     `--c-ink3` por dar 3,86:1 — e ficou para trás quando a tinta foi corrigida.
     Agora acompanha a tinta terciária do tema. Se `--c-ink3` mudar de novo,
     mudar aqui também: são as duas únicas cópias. */
  html.claro .inp-quiet {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%23636A78' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  }

  /* botão de palavra: usado no lugar dos pares de pílula (tema, período).
     A ativa não ganha fundo — ganha tinta cheia e um fio embaixo. */
  .word {
    border: 0; background: transparent; cursor: pointer; font-family: inherit;
    font-size: var(--fs-small); font-style: italic; color: var(--c-ink3);
    line-height: var(--lh-small);
    padding: 2px 0; border-bottom: 1px solid transparent; min-height: 24px;
    transition: color .16s ease, border-color .16s ease;
  }
  .word:hover { color: var(--c-ink2); }
  .word[aria-pressed="true"], .word[aria-current="page"] { color: var(--c-ink); border-bottom-color: var(--c-ink); }

  /* --------------------------------------------------------------------------
     BARRA DE PROGRESSO + RÉGUA DE RITMO
     -------------------------------------------------------------------------- */
  .track { background: var(--c-track); border-radius: 1px; overflow: hidden; }
  .fill  { height: 100%; border-radius: 1px; transition: width .7s cubic-bezier(.22, 1, .36, 1); }
  /* onde você deveria estar hoje — a marca que dá sentido à barra */
  .pace  { position: absolute; top: -3px; height: 14px; width: 1px; background: var(--c-ink); opacity: .75; }

  /* --------------------------------------------------------------------------
     INTERRUPTOR (matéria ativa)
     -------------------------------------------------------------------------- */
  .sw {
    position: relative; flex: none; width: 40px; height: 24px; border-radius: 999px;
    cursor: pointer; background: var(--c-track); border: 1px solid var(--c-sw-off);
    transition: background .2s ease, border-color .2s ease;
  }
  /* Era 34×19 com botão de 13px: passava na exceção de espaçamento da 2.5.8, mas
     no toque era o menor controle da tela. 24px é o piso de alvo da norma, e a
     geometria foi reescalada inteira — subir só a altura achataria o botão
     (22px de caixa útil para um botão de 13 deixaria 4px de folga). Caixa útil
     38×22, botão 18, folga 2, curso 16. */
  .sw::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
    border-radius: 50%; background: var(--c-ink3);
    transition: transform .2s cubic-bezier(.22, 1, .36, 1), background .2s ease;
  }
  .sw[aria-checked="true"] { background: var(--c-ink); border-color: var(--c-ink); }
  .sw[aria-checked="true"]::after { transform: translateX(16px); background: var(--c-page); }
  .sw:disabled { opacity: .4; cursor: not-allowed; }

  /* --------------------------------------------------------------------------
     NAVEGAÇÃO — um índice impresso
     -------------------------------------------------------------------------- */
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: var(--sp-1); border: 0;
    cursor: pointer; background: transparent; font-family: inherit;
    font-size: var(--fs-micro); color: var(--c-ink3); padding: 6px 4px;
    border-radius: 4px; transition: color .18s ease;
  }
  .nav-btn:hover { color: var(--c-ink2); }
  .nav-btn[aria-current="page"] { color: var(--c-ink); }
  @media (min-width: 768px) {
    .nav-btn {
      flex-direction: row; justify-content: center; gap: var(--sp-2); padding: var(--sp-2) 2px 6px;
      font-size: var(--fs-small); border-radius: 0;
      border-bottom: 2px solid transparent;
    }
    /* no desktop a aba ativa é marcada por fio, como num índice */
    .nav-btn[aria-current="page"] { border-bottom-color: var(--c-ink); }
  }

  /* --------------------------------------------------------------------------
     MOVIMENTO — só o que responde a uma ação. Nada de entrada por seção.
     -------------------------------------------------------------------------- */
  @keyframes popIn   { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  .anim-pop   { animation: popIn .16s ease-out both; }
  .anim-sheet { animation: slideUp .22s cubic-bezier(.22, 1, .36, 1) both; }

  input[type="date"] { color-scheme: dark; }
  html.claro input[type="date"] { color-scheme: light; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"] { -moz-appearance: textfield; }

  /* seta do select desenhada com a cor do tema */
  select.inp {
    appearance: none; background-image: none; padding-right: 2rem;
    background-repeat: no-repeat; background-position: right .5rem center;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237E8796' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  }
  html.claro select.inp {
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23767D8B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  }

  .no-scrollbar::-webkit-scrollbar { display: none; }

  /* Regras próprias (não dependem do JIT do CDN): o conteúdo inserido
     dinamicamente só recebe overflow-x-auto depois que o Tailwind observa o
     nó — o que causava um frame de rolagem horizontal na 1ª visita à aba. */
  /* Conteúdo largo NÃO empurra a página: a rolagem fica no próprio bloco. Dois usos —
     a tabela de histórico (min-w-[700px]) e o gráfico de 7 dias, cujos 7 rótulos de dia
     mais os vãos pedem 374px numa coluna de 320px a 200% de texto. As barras e os
     rótulos rolam JUNTOS porque ambos são filhos do mesmo contêiner. */
  .scroll-x { overflow-x: auto; }
  .scroll-y { overflow-y: auto; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; animation-iteration-count: 1 !important;
      transition-duration: .001ms !important; scroll-behavior: auto !important;
    }
  }
</style>

<script>
/* ============================================================================
   ROTINA ITA — SPA de organização de estudos
   HTML5 + Tailwind (CDN, layout) + camada de tokens própria (cor/tipografia)
   + Vanilla JS ES6+ · persistência em localStorage
   Regras: sem automações punitivas, sem IA, sem cronômetro, registro manual.
   ========================================================================== */

/* ---------------------------------------------------------------------------
   1. CONSTANTES
   ------------------------------------------------------------------------- */
const LS_KEY = 'rotina-ita-v1';

/* Cada matéria tem TRÊS variantes, porque um único hex não passa AA nos dois temas:
   - color : identidade (barras, pontos, trilhos) — usada como preenchimento
   - deep  : texto/ícone sobre fundo CLARO. Conferido >= 5:1 sobre o fundo do chip
             (a própria cor a 12% sobre o painel #F4F6FA, que é mais escuro que o
             card branco e portanto o pior caso). Não clareie sem medir de novo.
   - light : texto/ícone sobre fundo ESCURO. Conferido >= 5:1 sobre #161B26.
   Sem as três, Matemática/Português/Redação ficavam em 2,9-3,6:1 no tema escuro.

   CONTRASTE NÃO BASTA: as cores também têm de ser DISTINGUÍVEIS ENTRE SI, porque a
   cor é a identidade da matéria — duas matérias com cores parecidas anulam o código.
   Medido em CIEDE2000, nas três variantes. Português (violeta, matiz 258°) e Redação
   (púrpura, 271°) estavam a ΔE00 4,99: indistinguíveis num ponto de 7px e num trilho
   de 2px. Redação passou para rosa (matiz 330°), e o pior par da paleta foi de 4,99
   para 12,32 (Matemática x Português, deep). Meça o ΔE de TODOS os pares antes de
   trocar qualquer cor. */
const SUBJECTS = [
  { id: 'matematica', name: 'Matemática', short: 'MAT', icon: 'sigma',         color: '#2563EB', deep: '#1D4ED8', light: '#60A5FA' }, // 5.27
  { id: 'fisica',     name: 'Física',     short: 'FIS', icon: 'atom',          color: '#06B6D4', deep: '#0D6B85', light: '#22D3EE' }, // 5.04
  { id: 'quimica',    name: 'Química',    short: 'QUI', icon: 'flask-conical', color: '#10B981', deep: '#047152', light: '#34D399' }, // 5.02
  { id: 'portugues',  name: 'Português',  short: 'POR', icon: 'book-open',     color: '#8B5CF6', deep: '#6D28D9', light: '#A78BFA' }, // 5.69
  { id: 'ingles',     name: 'Inglês',     short: 'ING', icon: 'languages',     color: '#F59E0B', deep: '#A24B08', light: '#FBBF24' }, // 5.04
  { id: 'redacao',    name: 'Redação',    short: 'RED', icon: 'pen-line',      color: '#EC4899', deep: '#9D174D', light: '#F472B6' }, // 6.31
];
const SUBJECT_MAP = Object.fromEntries(SUBJECTS.map(s => [s.id, s]));

const DAYS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const DAYS_SHORT = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];

const STATUS = {
  nao_iniciado: { label: 'Não iniciado' },
  em_estudo:    { label: 'Em estudo' },
  concluido:    { label: 'Concluído' },
};

const PRIORITY = {
  alta:  { label: 'Alta',  weight: 3 },
  media: { label: 'Média', weight: 2 },
  baixa: { label: 'Baixa', weight: 1 },
};

const TYPES = {
  teoria:     'Teoria',
  exercicios: 'Exercícios',
  revisao:    'Revisão',
};

const SEED = {
  matematica: ['Funções e gráficos', 'Trigonometria', 'Matrizes e determinantes', 'Geometria analítica',
               'Números complexos', 'Polinômios e equações', 'Progressões', 'Logaritmos e exponenciais',
               'Análise combinatória', 'Probabilidade e estatística', 'Sistemas lineares'],
  fisica: ['Cinemática', 'Leis de Newton', 'Trabalho e energia', 'Impulso e quantidade de movimento',
           'Gravitação universal', 'Hidrostática e hidrodinâmica', 'Termologia e calorimetria',
           'Ondulatória', 'Óptica geométrica', 'Eletrostática', 'Eletrodinâmica', 'Magnetismo e indução'],
  quimica: ['Estrutura atômica', 'Tabela periódica', 'Ligações químicas', 'Funções inorgânicas',
            'Estequiometria', 'Soluções e concentração', 'Termoquímica', 'Cinética química',
            'Equilíbrio químico', 'Eletroquímica', 'Química orgânica — funções', 'Polímeros'],
  portugues: ['Interpretação de texto', 'Sintaxe — termos da oração', 'Concordância verbal e nominal',
              'Regência e crase', 'Pontuação', 'Figuras de linguagem', 'Literatura — modernismo',
              'Semântica e coesão'],
  ingles: ['Estratégias de leitura', 'Vocabulário acadêmico', 'Tempos verbais', 'Voz passiva',
           'Pronomes relativos', 'False friends e cognatos', 'Cloze tests'],
  redacao: ['Estrutura dissertativo-argumentativa', 'Repertório sociocultural', 'Coesão e coerência',
            'Proposta de intervenção', 'Argumentação e refutação', 'Modalidades — carta e crônica'],
};

/* ---------------------------------------------------------------------------
   2. UTILITÁRIOS
   ------------------------------------------------------------------------- */
const $  = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function mondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d;
}
function weekKeyOf(date = new Date()) { return iso(mondayOf(date)); }
function weekRange(date = new Date()) {
  const start = mondayOf(date);
  const end = new Date(start);
  end.setDate(end.getDate() + 6);
  return { start: iso(start), end: iso(end), startObj: start };
}
function todayIndex() { return (new Date().getDay() + 6) % 7; }
function todayIso() { return iso(new Date()); }

function addDaysIso(baseIsoStr, n) {
  const [y, m, d] = baseIsoStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return iso(dt);
}

function fmtMinutes(m) {
  m = Math.max(0, Math.round(Number(m) || 0));
  const h = Math.floor(m / 60), r = m % 60;
  if (h && r) return `${h}h ${r}m`;
  if (h) return `${h}h`;
  return `${r}m`;
}
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const pct = (a, b) => (b > 0 ? clamp((a / b) * 100, 0, 100) : 0);
const rgba = (hex, a) => {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
};

const isClaro = () => document.documentElement.classList.contains('claro');
/* cor de texto/ícone legível da matéria no tema atual */
/* A cor de preenchimento (barras, pontos, trilhos) segue o TEMA, não a identidade:
   no claro vale `deep` (a variante escura), no escuro vale `light`. Usar a cor-base
   no claro dava 1,8:1 sobre o trilho — reprovava em 1.4.11 (objetos gráficos, 3:1).
   Ela também tem de contrastar com o TRILHO, não só com a página. */
const subjFill = s => (isClaro() ? s.deep : s.light);

function longDate(d = new Date()) {
  const s = new Intl.DateTimeFormat('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }).format(d);
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function shortDate(dateIso) {
  if (!dateIso) return '—';
  const [, m, d] = dateIso.split('-').map(Number);
  return `${String(d).padStart(2, '0')}/${String(m).padStart(2, '0')}`;
}
function dayNameFromIso(dateIso) {
  const [y, m, d] = dateIso.split('-').map(Number);
  return DAYS_SHORT[(new Date(y, m - 1, d).getDay() + 6) % 7];
}

/* ---------------------------------------------------------------------------
   2. RÓTULOS E CLASSES DE CONTROLE
   ---------------------------------------------------------------------------
   Sem `chip`: estado e prioridade agora são palavras (statusWord/priorityWord),
   então o mapa guarda só rótulo e peso. */
function field(label, control, hint) {
  return `<label class="block"><span class="mb-1.5 block t-field">${esc(label)}</span>${control}${
    hint ? `<span class="mt-1.5 block t-hint">${esc(hint)}</span>` : ''}</label>`;
}

const INP = 'inp';
const BTN_PRI = 'btn btn-pri';
const BTN_GHOST = 'btn btn-ghost';
const BTN_DANGER = 'btn btn-danger';
const BTN_ICON = 'btn-icon';

/* ---------------------------------------------------------------------------
   3. ESTADO + PERSISTÊNCIA
   ------------------------------------------------------------------------- */
function defaultState() {
  const topics = [];
  SUBJECTS.forEach(s => {
    (SEED[s.id] || []).forEach(name => {
      topics.push({ id: uid(), subjectId: s.id, name, status: 'nao_iniciado', archived: false, createdAt: Date.now() });
    });
  });
  return {
    version: 2,
    settings: {
      weeklyGoalHours: 25,
      weeklyAvailabilityHours: 35,
      theme: 'escuro',
      priorities: { matematica: 'alta', fisica: 'alta', quimica: 'media', portugues: 'media', ingles: 'baixa', redacao: 'media' },
      activeSubjects: SUBJECTS.map(s => s.id),
    },
    topics,
    /* `plannedMinutes` é o PLANO. O REALIZADO vive em `sessions.minutes` — não
       existe `minutes` aqui desde a separação plano/realizado; o normalizador
       ainda lê `a.minutes` apenas para migrar estados antigos. O comentário
       antigo dizia `minutes`, e foi o que sobrou da renomeação. */
    activities: [],   // { id, topicId, subjectId, plannedMinutes, priority, day: 0-6 | null, weekKey, done, doneAt }
    sessions:  [],    // { id, date, subjectId, topicId|null, minutes, type, notes, activityId|null }
  };
}

/* normaliza qualquer estado vindo do storage (arrays vazios / chaves faltando) */
function normalize(raw) {
  const def = defaultState();
  if (!raw || typeof raw !== 'object') return def;
  const s = {
    version: 2,
    settings: Object.assign({}, def.settings, raw.settings || {}),
    topics: Array.isArray(raw.topics) ? raw.topics : [],
    activities: Array.isArray(raw.activities) ? raw.activities : [],
    sessions: Array.isArray(raw.sessions) ? raw.sessions : [],
  };
  s.settings.priorities = Object.assign({}, def.settings.priorities, s.settings.priorities || {});
  s.settings.theme = (s.settings.theme === 'claro' || s.settings.theme === 'escuro') ? s.settings.theme : 'escuro';
  s.settings.activeSubjects = Array.isArray(s.settings.activeSubjects) && s.settings.activeSubjects.length
    ? s.settings.activeSubjects.filter(id => SUBJECT_MAP[id])
    : def.settings.activeSubjects;
  if (!Number.isFinite(Number(s.settings.weeklyGoalHours))) s.settings.weeklyGoalHours = def.settings.weeklyGoalHours;
  if (!Number.isFinite(Number(s.settings.weeklyAvailabilityHours))) s.settings.weeklyAvailabilityHours = def.settings.weeklyAvailabilityHours;

  s.topics = s.topics
    .filter(t => t && SUBJECT_MAP[t.subjectId])
    .map(t => ({
      id: String(t.id || uid()),
      subjectId: t.subjectId,
      name: String(t.name || 'Sem nome'),
      status: STATUS[t.status] ? t.status : 'nao_iniciado',
      archived: !!t.archived,
      createdAt: Number(t.createdAt) || Date.now(),
    }));
  s.activities = s.activities
    .filter(a => a && a.topicId)
    .map(a => {
      const topic = s.topics.find(t => t.id === a.topicId);
      return {
        id: String(a.id || uid()),
        topicId: a.topicId,
        subjectId: (topic && topic.subjectId) || a.subjectId || 'matematica',
        /* plannedMinutes é IMUTÁVEL: é o PLANO, não o realizado. Antes havia só
           `minutes`, e save-complete o sobrescrevia com a duração real — então o
           "Planejado nesta semana" mudava sozinho ao concluir, e "planejei 20h,
           cumpri 18h" era ilegível (os dois números colapsavam num só). O realizado
           vive na SESSÃO, ligada por activityId. Migração: dado antigo não tem o
           campo; para atividade já concluída o plano original é irrecuperável (foi
           sobrescrito), então `minutes` — que ali guarda o real — é a melhor
           aproximação disponível. Ela é estável e para de mudar daqui em diante. */
        plannedMinutes: clamp(Math.round(Number(a.plannedMinutes ?? a.minutes) || 0), 0, 1440),
        priority: PRIORITY[a.priority] ? a.priority : 'media',
        day: a.day === null || a.day === undefined ? null : clamp(Number(a.day), 0, 6),
        weekKey: a.weekKey || weekKeyOf(),
        done: !!a.done,
        doneAt: a.doneAt || null,
      };
    })
    .filter(a => s.topics.some(t => t.id === a.topicId));
  s.sessions = s.sessions
    .filter(x => x && SUBJECT_MAP[x.subjectId])
    .map(x => ({
      id: String(x.id || uid()),
      date: /^\d{4}-\d{2}-\d{2}$/.test(x.date) ? x.date : todayIso(),
      subjectId: x.subjectId,
      topicId: x.topicId && s.topics.some(t => t.id === x.topicId) ? x.topicId : null,
      minutes: clamp(Math.round(Number(x.minutes) || 0), 0, 1440),
      type: TYPES[x.type] ? x.type : 'teoria',
      notes: String(x.notes || ''),
      activityId: x.activityId || null,
    }));
  return s;
}

function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultState();
    return normalize(JSON.parse(raw));
  } catch (err) {
    console.warn('Falha ao ler localStorage — usando estado padrão.', err);
    return defaultState();
  }
}
function save() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); }
  catch (err) { toast('Não foi possível salvar localmente.', 'error'); console.warn(err); }
}

let S = load();

/* estado de UI (não persistido) */
const UI = {
  tab: 'hoje',
  progPeriod: 'semana',
  histLimit: 15,
  showArchived: {},   // subjectId -> bool
};

/* ---------------------------------------------------------------------------
   4. TEMA
   ------------------------------------------------------------------------- */
function applyTheme() {
  const claro = S.settings.theme === 'claro';
  document.documentElement.classList.toggle('claro', claro);
  const meta = $('#meta-tema');
  if (meta) meta.setAttribute('content', claro ? '#F6F7FA' : '#0B0F19');
}

/* ---------------------------------------------------------------------------
   5. CONSULTAS DERIVADAS
   ------------------------------------------------------------------------- */
const currentWeekActivities = () => S.activities.filter(a => a.weekKey === weekKeyOf());
const pastOpenActivities = () => S.activities.filter(a => a.weekKey !== weekKeyOf() && !a.done);
const weekSessions = () => {
  const { start, end } = weekRange();
  return S.sessions.filter(s => s.date >= start && s.date <= end);
};
const weekMinutes = () => weekSessions().reduce((sum, s) => sum + s.minutes, 0);
const goalMinutes = () => Math.max(0, Math.round(Number(S.settings.weeklyGoalHours) || 0) * 60);
const availabilityMinutes = () => Math.max(0, Math.round(Number(S.settings.weeklyAvailabilityHours) || 0) * 60);
const topicById = id => S.topics.find(t => t.id === id);
const subjectOf = id => SUBJECT_MAP[id] || SUBJECTS[0];
const visibleTopics = subjectId => S.topics.filter(t => t.subjectId === subjectId && !t.archived);
const isActiveSubject = id => S.settings.activeSubjects.includes(id);

/* quanto do ritmo da semana já deveria estar cumprido ao fim de hoje */
const pacePct = () => ((todayIndex() + 1) / 7) * 100;

function plannedMinutesBySubject() {
  const map = {};
  SUBJECTS.forEach(s => { map[s.id] = 0; });
  currentWeekActivities().forEach(a => { map[a.subjectId] = (map[a.subjectId] || 0) + a.plannedMinutes; });
  return map;
}
function suggestedMinutesBySubject() {
  const map = {};
  const actives = SUBJECTS.filter(s => isActiveSubject(s.id));
  const total = actives.reduce((sum, s) => sum + (PRIORITY[S.settings.priorities[s.id] || 'media'].weight), 0);
  actives.forEach(s => {
    map[s.id] = total ? Math.round((goalMinutes() * PRIORITY[S.settings.priorities[s.id] || 'media'].weight) / total) : 0;
  });
  SUBJECTS.filter(s => !isActiveSubject(s.id)).forEach(s => { map[s.id] = 0; });
  return map;
}

/* ---------------------------------------------------------------------------
   6. TOAST / MODAL
   ------------------------------------------------------------------------- */
function toast(msg, kind = 'ok') {
  const root = $('#toast-root');
  /* o aviso é uma faixa pautada, não uma pílula: fio de 2px à esquerda na cor
     do estado, o resto em tinta. */
  const cor = { ok: 'var(--c-ok)', error: 'var(--c-danger)', info: 'var(--c-ink3)' }[kind] || 'var(--c-ink3)';
  const el = document.createElement('div');
  el.className = 'anim-pop pointer-events-auto leaf rail t-small ink px-4 py-2.5';
  el.style.setProperty('--rail', cor);
  el.style.boxShadow = '0 6px 20px -12px rgba(0,0,0,.6)';
  el.textContent = msg;
  root.appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s ease'; }, 2400);
  setTimeout(() => el.remove(), 2700);
}

let focoAntesDoModal = null;
function modal({ title, sub, body, footer, wide }) {
  const root = $('#modal-root');
  /* Guarda quem tinha o foco para devolvê-lo ao fechar. Sem isso, quem navega por
     teclado perde o lugar: fecha o diálogo e o foco fica solto na página. */
  if (document.activeElement && document.activeElement !== document.body) focoAntesDoModal = document.activeElement;
  /* o modal é uma das poucas coisas que FLUTUA — por isso, e só por isso,
     ele ganha superfície. O cabeçalho é fechado por fio, não por sombra. */
  /* role/aria-modal/aria-labelledby: sem eles o diálogo não se anuncia como diálogo
     e o conteúdo de trás continua alcançável pelo leitor de tela — a barreira era
     só visual (`overflow: hidden` no body barra a rolagem, não a navegação). */
  root.innerHTML = `
    <div data-act="modal-backdrop" class="fixed inset-0 z-50 flex items-end justify-center bg-black/70 p-0 backdrop-blur-sm md:items-center md:p-4">
      <div class="anim-sheet scroll-y w-full leaf ${wide ? 'md:max-w-2xl' : 'md:max-w-lg'} max-h-[92vh]"
           role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
        <div class="flex items-start justify-between gap-4 px-5 py-4" style="border-bottom: 1px solid var(--c-rule)">
          <div class="min-w-0">
            <h3 class="t-h2 ink" id="modal-titulo">${esc(title)}</h3>
            ${sub ? `<p class="mt-1 t-meta">${esc(sub)}</p>` : ''}
          </div>
          <button type="button" data-act="close-modal" class="${BTN_ICON} shrink-0" aria-label="Fechar"><i data-lucide="x"></i></button>
        </div>
        <div class="px-5 py-5">${body}</div>
        <div class="flex flex-wrap items-center justify-end gap-2 px-5 py-4" style="border-top: 1px solid var(--c-rule)">${footer}</div>
      </div>
    </div>`;
  root.classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  paint();
  const first = root.querySelector('input, select, textarea');
  if (first) setTimeout(() => first.focus(), 60);
}
function closeModal() {
  const root = $('#modal-root');
  root.classList.add('hidden');
  root.innerHTML = '';
  document.body.style.overflow = '';
  /* devolve o foco a quem abriu o diálogo — se ainda estiver na página */
  if (focoAntesDoModal && document.contains(focoAntesDoModal)) {
    try { focoAntesDoModal.focus(); } catch (err) { /* elemento pode ter sido removido pelo render */ }
  }
  focoAntesDoModal = null;
}

let pendingConfirm = null;
function confirmModal({ title, text, confirmLabel = 'Confirmar', danger = true, onConfirm }) {
  pendingConfirm = onConfirm;
  modal({
    title,
    body: `<p class="t-body ink2">${esc(text)}</p>`,
    footer: `<button type="button" class="${BTN_GHOST}" data-act="close-modal">Cancelar</button>
             <button type="button" class="${danger ? BTN_DANGER : BTN_PRI}" data-act="confirm-yes">${esc(confirmLabel)}</button>`,
  });
}
